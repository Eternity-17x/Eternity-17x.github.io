<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>喜欢徐依晨的全部</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;
      color: #f0e6d2;
      font-family: "KaiTi", "STKaiti", "SimSun", "Microsoft YaHei", "PingFang SC", "Noto Serif SC", serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* 中心文字 */
    .center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(52px, 8vw, 80px);
      font-weight: 400;
      font-style: italic;
      white-space: nowrap;
      z-index: 20;
      opacity: 0;
      transition: opacity 1.5s ease;
      text-shadow: 0 0 35px rgba(255, 235, 190, 0.6), 0 0 80px rgba(255, 200, 140, 0.4);
      letter-spacing: 4px;
      pointer-events: none;
      animation: centerGlow 4s ease-in-out infinite alternate;
      color: #fffdf5;
    }

    @keyframes centerGlow {
      0% {
        text-shadow: 0 0 25px rgba(255, 235, 190, 0.5), 0 0 60px rgba(255, 200, 140, 0.3);
      }
      100% {
        text-shadow: 0 0 45px rgba(255, 235, 190, 0.8), 0 0 100px rgba(255, 200, 140, 0.5);
      }
    }

    /* 周围文字 - 静态无动画，确保不重叠 */
    .word {
      position: absolute;
      font-size: clamp(24px, 3.5vw, 38px);
      font-style: italic;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 1s ease;
      z-index: 5;
      pointer-events: none;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
      font-weight: 350;
      color: #e0d0b0;
      letter-spacing: 2px;
      transform: translate(-50%, -50%);
    }

    .word.show {
      opacity: 1;
    }

    /* 测量容器 */
    .measure-container {
      position: absolute;
      visibility: hidden;
      white-space: nowrap;
      font-style: italic;
      pointer-events: none;
      z-index: -999;
    }

    .center-aura {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, rgba(255, 210, 150, 0.08) 0%, transparent 70%);
      border-radius: 50%;
      z-index: 1;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="center-aura"></div>
  <div class="center-text" id="centerText">我会喜欢徐依晨的全部</div>
  <div id="wordsContainer"></div>
  <div id="measureContainer" class="measure-container"></div>

  <script>
    (function() {
      const words = [
        "徐依晨的名字", "徐依晨的性格", "徐依晨的样子", "徐依晨的鼻子", "徐依晨的眼睛",
        "徐依晨的耳朵", "徐依晨的嘴巴", "徐依晨的快乐", "徐依晨的难过", "徐依晨的美丽",
        "徐依晨的声音", "徐依晨的开朗", "徐依晨的不堪", "徐依晨的优点", "徐依晨的腼腆",
        "徐依晨的窘迫", "徐依晨的脆弱", "徐依晨的生气", "徐依晨的底线", "徐依晨的古板",
        "徐依晨的家人", "徐依晨的人格", "徐依晨的家乡", "徐依晨的三观", "徐依晨的嗜好",
        "徐依晨的灵动", "徐依晨的善良", "徐依晨的经历", "徐依晨的生日", "徐依晨的浪漫",
        "徐依晨的不甘", "徐依晨的固执", "徐依晨的朋友", "徐依晨的尊严", "徐依晨的天真",
        "徐依晨的美好", "徐依晨的血型"
      ];

      const container = document.getElementById('wordsContainer');
      const centerTextEl = document.getElementById('centerText');
      const measureContainer = document.getElementById('measureContainer');

      let screenWidth = window.innerWidth;
      let screenHeight = window.innerHeight;
      let centerX = screenWidth / 2;
      let centerY = screenHeight / 2;

      // 存储已放置文字的精确矩形
      let placedRects = [];

      // 获取当前实际字体大小
      function getCurrentFontSize() {
        const w = screenWidth;
        if (w < 480) return 24;
        if (w < 768) return 28;
        if (w < 1024) return 34;
        return 38;
      }

      function getCurrentCenterFontSize() {
        const w = screenWidth;
        if (w < 480) return 52;
        if (w < 768) return 60;
        if (w < 1024) return 70;
        return 80;
      }

      // 使用DOM实际测量文字尺寸
      function measureText(text, fontSize) {
        const measureEl = document.createElement('span');
        measureEl.textContent = text;
        measureEl.style.fontSize = fontSize + 'px';
        measureEl.style.fontFamily = getComputedStyle(document.body).fontFamily;
        measureEl.style.fontStyle = 'italic';
        measureEl.style.letterSpacing = '2px';
        measureContainer.appendChild(measureEl);
        
        const rect = measureEl.getBoundingClientRect();
        const width = rect.width;
        const height = rect.height;
        
        measureContainer.removeChild(measureEl);
        
        return { width, height };
      }

      // 预测量所有文字尺寸
      function measureAllWords(fontSize) {
        const sizes = {};
        words.forEach(word => {
          sizes[word] = measureText(word, fontSize);
        });
        return sizes;
      }

      // 测量中心文字
      function measureCenterText(fontSize) {
        return measureText("我会喜欢徐依晨的全部", fontSize);
      }

      // 根据文字中心点和尺寸计算矩形
      function getRectFromCenter(cx, cy, width, height) {
        return {
          left: cx - width / 2,
          top: cy - height / 2,
          right: cx + width / 2,
          bottom: cy + height / 2,
          width: width,
          height: height
        };
      }

      // 矩形重叠检测（带较大缓冲区确保视觉上有明显间距）
      function rectsOverlap(rect1, rect2, buffer) {
        return !(
          rect1.right + buffer < rect2.left ||
          rect1.left - buffer > rect2.right ||
          rect1.bottom + buffer < rect2.top ||
          rect1.top - buffer > rect2.bottom
        );
      }

      // 获取参数 - 增大所有间距
      function getParams() {
        const w = screenWidth;
        if (w < 480) {
          return {
            centerBuffer: 100,
            wordBuffer: 40,
            edgeMargin: 15,
            maxAttempts: 1000,
          };
        } else if (w < 768) {
          return {
            centerBuffer: 130,
            wordBuffer: 50,
            edgeMargin: 20,
            maxAttempts: 900,
          };
        } else if (w < 1024) {
          return {
            centerBuffer: 160,
            wordBuffer: 60,
            edgeMargin: 30,
            maxAttempts: 800,
          };
        } else {
          return {
            centerBuffer: 200,
            wordBuffer: 75,
            edgeMargin: 40,
            maxAttempts: 700,
          };
        }
      }

      // 生成不重叠的偏左位置
      function generatePositions(wordSizes, centerSize, params) {
        const positions = [];
        placedRects = [];

        const { centerBuffer, wordBuffer, edgeMargin, maxAttempts } = params;

        // 添加中心文字的占用区域（带缓冲）
        const centerRect = getRectFromCenter(centerX, centerY, centerSize.width, centerSize.height);
        const centerProtected = {
          left: centerRect.left - centerBuffer,
          top: centerRect.top - centerBuffer,
          right: centerRect.right + centerBuffer,
          bottom: centerRect.bottom + centerBuffer,
          isCenter: true
        };
        placedRects.push(centerProtected);

        const minX = edgeMargin;
        const maxX = screenWidth - edgeMargin;
        const minY = edgeMargin;
        const maxY = screenHeight - edgeMargin;

        // 创建网格系统用于更均匀的分布
        const avgWordWidth = Object.values(wordSizes).reduce((sum, s) => sum + s.width, 0) / words.length;
        const avgWordHeight = Object.values(wordSizes).reduce((sum, s) => sum + s.height, 0) / words.length;
        
        const gridCellWidth = avgWordWidth + wordBuffer;
        const gridCellHeight = avgWordHeight + wordBuffer;
        
        const cols = Math.floor((maxX - minX) / gridCellWidth);
        const rows = Math.floor((maxY - minY) / gridCellHeight);

        // 创建所有可用网格单元
        const allCells = [];
        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) {
            const cellX = minX + col * gridCellWidth + gridCellWidth / 2;
            const cellY = minY + row * gridCellHeight + gridCellHeight / 2;
            
            // 检查是否在屏幕内
            if (cellX - avgWordWidth/2 < minX || cellX + avgWordWidth/2 > maxX ||
                cellY - avgWordHeight/2 < minY || cellY + avgWordHeight/2 > maxY) {
              continue;
            }
            
            // 检查是否与中心区域重叠
            const cellRect = getRectFromCenter(cellX, cellY, avgWordWidth, avgWordHeight);
            if (rectsOverlap(cellRect, centerProtected, centerBuffer)) {
              continue;
            }
            
            allCells.push({ x: cellX, y: cellY });
          }
        }

        // 随机打乱所有可用单元格
        for (let i = allCells.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [allCells[i], allCells[j]] = [allCells[j], allCells[i]];
        }

        // 为每个文字分配位置
        const usedCells = new Set();
        
        for (let i = 0; i < words.length; i++) {
          const wordText = words[i];
          const wordSize = wordSizes[wordText];
          let placed = false;
          let finalX = 0, finalY = 0;

          // 首先尝试从可用网格单元中找一个合适的位置
          for (let cellIndex = 0; cellIndex < allCells.length; cellIndex++) {
            if (usedCells.has(cellIndex)) continue;
            
            const cell = allCells[cellIndex];
            const textRect = getRectFromCenter(cell.x, cell.y, wordSize.width, wordSize.height);
            
            // 边界检查
            if (textRect.left < minX || textRect.right > maxX || 
                textRect.top < minY || textRect.bottom > maxY) {
              continue;
            }
            
            // 碰撞检测（与已放置的文字）
            let hasOverlap = false;
            for (const placedRect of placedRects) {
              const buffer = placedRect.isCenter ? centerBuffer : wordBuffer;
              if (rectsOverlap(textRect, placedRect, buffer)) {
                hasOverlap = true;
                break;
              }
            }
            
            if (!hasOverlap) {
              finalX = cell.x;
              finalY = cell.y;
              placed = true;
              usedCells.add(cellIndex);
              break;
            }
          }

          // 如果网格分配失败，使用随机尝试
          if (!placed) {
            for (let attempt = 0; attempt < maxAttempts; attempt++) {
              const x = minX + Math.random() * (maxX - minX);
              const y = minY + Math.random() * (maxY - minY);

              const textRect = getRectFromCenter(x, y, wordSize.width, wordSize.height);
              
              if (textRect.left < minX || textRect.right > maxX || 
                  textRect.top < minY || textRect.bottom > maxY) {
                continue;
              }
              
              let hasOverlap = false;
              for (const placedRect of placedRects) {
                const buffer = placedRect.isCenter ? centerBuffer : wordBuffer;
                if (rectsOverlap(textRect, placedRect, buffer)) {
                  hasOverlap = true;
                  break;
                }
              }
              
              if (!hasOverlap) {
                finalX = x;
                finalY = y;
                placed = true;
                break;
              }
            }
          }

          // 最终回退：强制放置但不重叠中心
          if (!placed) {
            // 在屏幕四个角落寻找位置
            const corners = [
              { x: minX + wordSize.width/2 + 10, y: minY + wordSize.height/2 + 10 },
              { x: maxX - wordSize.width/2 - 10, y: minY + wordSize.height/2 + 10 },
              { x: minX + wordSize.width/2 + 10, y: maxY - wordSize.height/2 - 10 },
              { x: maxX - wordSize.width/2 - 10, y: maxY - wordSize.height/2 - 10 },
            ];
            
            for (const corner of corners) {
              const textRect = getRectFromCenter(corner.x, corner.y, wordSize.width, wordSize.height);
              let hasOverlap = false;
              for (const placedRect of placedRects) {
                if (placedRect.isCenter) {
                  if (rectsOverlap(textRect, placedRect, centerBuffer)) {
                    hasOverlap = true;
                    break;
                  }
                }
              }
              if (!hasOverlap) {
                finalX = corner.x;
                finalY = corner.y;
                placed = true;
                break;
              }
            }
            
            // 如果还是失败，使用最后的随机位置
            if (!placed) {
              finalX = minX + wordSize.width/2 + Math.random() * (maxX - minX - wordSize.width);
              finalY = minY + wordSize.height/2 + Math.random() * (maxY - minY - wordSize.height);
            }
          }

          // 记录位置
          positions.push({ x: finalX, y: finalY });
          const finalRect = getRectFromCenter(finalX, finalY, wordSize.width, wordSize.height);
          placedRects.push({ ...finalRect, isCenter: false });
        }

        return positions;
      }

      // 渲染文字
      function renderWords(posArray) {
        container.innerHTML = '';
        const fragment = document.createDocumentFragment();

        words.forEach((word, index) => {
          const pos = posArray[index];
          if (!pos) return;

          const div = document.createElement('div');
          div.className = 'word';
          div.textContent = word;
          div.style.left = `${pos.x}px`;
          div.style.top = `${pos.y}px`;

          fragment.appendChild(div);
        });

        container.appendChild(fragment);

        // 渐次显示
        const wordElements = container.querySelectorAll('.word');
        wordElements.forEach((el, idx) => {
          setTimeout(() => {
            el.classList.add('show');
          }, idx * 80 + 200);
        });
      }

      // 主布局函数
      function layoutAll() {
        screenWidth = window.innerWidth;
        screenHeight = window.innerHeight;
        centerX = screenWidth / 2;
        centerY = screenHeight / 2;

        const fontSize = getCurrentFontSize();
        const centerFontSize = getCurrentCenterFontSize();
        const params = getParams();
        
        const wordSizes = measureAllWords(fontSize);
        const centerSize = measureCenterText(centerFontSize);
        
        const positions = generatePositions(wordSizes, centerSize, params);
        renderWords(positions);
        
        centerTextEl.style.opacity = '1';
      }

      // 防抖重绘
      let resizeTimer;
      function onResize() {
        clearTimeout(resizeTimer);
        const allWords = container.querySelectorAll('.word');
        allWords.forEach(el => el.classList.remove('show'));
        centerTextEl.style.opacity = '0';

        resizeTimer = setTimeout(() => {
          layoutAll();
        }, 500);
      }

      // 初始化
      window.addEventListener('load', () => {
        centerTextEl.style.opacity = '0';
        setTimeout(layoutAll, 200);
      });

      window.addEventListener('resize', onResize);
      window.addEventListener('orientationchange', () => {
        setTimeout(onResize, 300);
      });
    })();
  </script>
</body>
</html>
