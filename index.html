<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>喜欢徐依晨的全部</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;
      color: #f0e6d2;
      font-family: "KaiTi", "STKaiti", "SimSun", "Microsoft YaHei", "PingFang SC", "Noto Serif SC", serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 48px;
      font-weight: 400;
      font-style: italic;
      white-space: nowrap;
      z-index: 20;
      opacity: 0;
      transition: opacity 1.5s ease;
      text-shadow: 0 0 35px rgba(255, 235, 190, 0.6), 0 0 80px rgba(255, 200, 140, 0.4);
      letter-spacing: 4px;
      pointer-events: none;
      animation: centerGlow 4s ease-in-out infinite alternate;
      color: #fffdf5;
    }

    @keyframes centerGlow {
      0% { text-shadow: 0 0 25px rgba(255, 235, 190, 0.5), 0 0 60px rgba(255, 200, 140, 0.3); }
      100% { text-shadow: 0 0 45px rgba(255, 235, 190, 0.8), 0 0 100px rgba(255, 200, 140, 0.5); }
    }

    .word {
      position: absolute;
      font-style: italic;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.8s ease;
      z-index: 5;
      pointer-events: none;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
      font-weight: 350;
      color: #e0d0b0;
      letter-spacing: 2px;
    }

    .word.show {
      opacity: 1;
    }

    .center-aura {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(255, 210, 150, 0.06) 0%, transparent 70%);
      border-radius: 50%;
      z-index: 1;
      pointer-events: none;
    }

    /* 增大了周围文字的字号 */
    @media (min-width: 2000px) {
      .word { font-size: 46px; }
      .center-text { font-size: 52px; }
    }
    @media (min-width: 1400px) and (max-width: 1999px) {
      .word { font-size: 40px; }
      .center-text { font-size: 48px; }
    }
    @media (min-width: 1024px) and (max-width: 1399px) {
      .word { font-size: 34px; }
      .center-text { font-size: 44px; }
    }
    @media (min-width: 768px) and (max-width: 1023px) {
      .word { font-size: 30px; }
      .center-text { font-size: 40px; }
    }
    @media (max-width: 767px) {
      .word { font-size: 26px; }
      .center-text { font-size: 34px; }
    }
  </style>
</head>
<body>
  <div class="center-aura"></div>
  <div class="center-text" id="centerText">我会喜欢徐依晨的全部</div>
  <div id="wordsContainer"></div>

  <script>
    (function() {
      const words = [
        "徐依晨的名字", "徐依晨的性格", "徐依晨的样子", "徐依晨的鼻子", "徐依晨的眼睛",
        "徐依晨的耳朵", "徐依晨的嘴巴", "徐依晨的快乐", "徐依晨的难过", "徐依晨的美丽",
        "徐依晨的声音", "徐依晨的开朗", "徐依晨的不堪", "徐依晨的优点", "徐依晨的腼腆",
        "徐依晨的窘迫", "徐依晨的脆弱", "徐依晨的生气", "徐依晨的底线", "徐依晨的古板",
        "徐依晨的家人", "徐依晨的人格", "徐依晨的家乡", "徐依晨的三观", "徐依晨的嗜好",
        "徐依晨的灵动", "徐依晨的善良", "徐依晨的经历", "徐依晨的生日", "徐依晨的浪漫",
        "徐依晨的不甘", "徐依晨的固执", "徐依晨的朋友", "徐依晨的尊严", "徐依晨的天真",
        "徐依晨的美好", "徐依晨的血型"
      ];

      const container = document.getElementById('wordsContainer');
      const centerTextEl = document.getElementById('centerText');

      function getCurrentFontSize() {
        const w = window.innerWidth;
        if (w >= 2000) return 46;
        if (w >= 1400) return 40;
        if (w >= 1024) return 34;
        if (w >= 768) return 30;
        return 26;
      }

      function getSpacing() {
        const w = window.innerWidth;
        if (w >= 2000) return 55;
        if (w >= 1400) return 45;
        if (w >= 1024) return 38;
        if (w >= 768) return 32;
        return 26;
      }

      function getCenterClearance() {
        const w = window.innerWidth;
        if (w >= 2000) return 240;
        if (w >= 1400) return 210;
        if (w >= 1024) return 180;
        if (w >= 768) return 155;
        return 130;
      }

      // DOM实际测量文字尺寸
      function measureAllWords() {
        const fontSize = getCurrentFontSize();
        const measureDiv = document.createElement('div');
        measureDiv.style.cssText = `
          position: absolute;
          visibility: hidden;
          font-style: italic;
          font-family: "KaiTi", "STKaiti", "SimSun", "Microsoft YaHei", serif;
          font-size: ${fontSize}px;
          letter-spacing: 2px;
          white-space: nowrap;
        `;
        document.body.appendChild(measureDiv);

        const sizes = {};
        words.forEach(word => {
          measureDiv.textContent = word;
          sizes[word] = {
            width: measureDiv.offsetWidth,
            height: measureDiv.offsetHeight
          };
        });

        const centerFontSize = window.innerWidth >= 2000 ? 52 : 
                               window.innerWidth >= 1400 ? 48 : 
                               window.innerWidth >= 1024 ? 44 : 
                               window.innerWidth >= 768 ? 40 : 34;
        measureDiv.style.fontSize = centerFontSize + 'px';
        measureDiv.textContent = "我会喜欢徐依晨的全部";
        const centerSize = {
          width: measureDiv.offsetWidth,
          height: measureDiv.offsetHeight
        };

        document.body.removeChild(measureDiv);
        return { sizes, centerSize };
      }

      // 检查新位置是否与已有位置重叠
      function isPositionValid(x, y, width, height, placed, spacing, centerClearance, centerX, centerY, centerSize) {
        const newRect = {
          left: x,
          top: y,
          right: x + width,
          bottom: y + height
        };

        // 检查边界
        if (newRect.left < 0 || newRect.right > window.innerWidth || 
            newRect.top < 0 || newRect.bottom > window.innerHeight) {
          return false;
        }

        // 检查与中心文字的距离
        const centerRect = {
          left: centerX - centerSize.width / 2 - centerClearance,
          top: centerY - centerSize.height / 2 - centerClearance,
          right: centerX + centerSize.width / 2 + centerClearance,
          bottom: centerY + centerSize.height / 2 + centerClearance
        };

        if (!(newRect.right + spacing < centerRect.left || 
              newRect.left - spacing > centerRect.right || 
              newRect.bottom + spacing < centerRect.top || 
              newRect.top - spacing > centerRect.bottom)) {
          return false;
        }

        // 检查与已放置文字的距离
        for (const placedRect of placed) {
          if (!(newRect.right + spacing < placedRect.left || 
                newRect.left - spacing > placedRect.right || 
                newRect.bottom + spacing < placedRect.top || 
                newRect.top - spacing > placedRect.bottom)) {
            return false;
          }
        }

        return true;
      }

      // 生成布局位置（修改了半径，让文字往中心靠拢）
      function generateLayout(sizes, centerSize) {
        const spacing = getSpacing();
        const centerClearance = getCenterClearance();
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;
        const placed = [];
        const positions = [];

        // 将文字随机打乱
        const wordList = words.map((word, i) => ({
          word,
          index: i,
          size: sizes[word]
        }));
        
        for (let i = wordList.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [wordList[i], wordList[j]] = [wordList[j], wordList[i]];
        }

        // 逐个放置文字
        for (const item of wordList) {
          const { width, height } = item.size;
          let placed_success = false;
          let px = 0, py = 0;

          // 第1阶段：70%概率尝试靠近中心（缩小了最大半径，让文字更集中）
          for (let attempt = 0; attempt < 3000; attempt++) {
            const angle = Math.random() * Math.PI * 2;
            const minRadius = centerClearance + Math.max(centerSize.width, centerSize.height) / 2;
            // 修改了这里，把最大半径从0.55缩小到0.45，让文字整体往中心靠拢
            const maxRadius = Math.min(window.innerWidth, window.innerHeight) * 0.45;
            const radius = minRadius + Math.pow(Math.random(), 1.5) * (maxRadius - minRadius);
            
            const tx = centerX + Math.cos(angle) * radius - width / 2;
            const ty = centerY + Math.sin(angle) * radius - height / 2;

            if (isPositionValid(tx, ty, width, height, placed, spacing, centerClearance, centerX, centerY, centerSize)) {
              px = tx;
              py = ty;
              placed_success = true;
              break;
            }
          }

          // 第2阶段：如果环形没找到，尝试屏幕内偏左的随机位置（涵盖四周）
          if (!placed_success) {
            for (let attempt = 0; attempt < 3000; attempt++) {
              const xRatio = Math.pow(Math.random(), 2.5);
              const tx = xRatio * (window.innerWidth - width);
              const ty = Math.random() * (window.innerHeight - height);

              if (isPositionValid(tx, ty, width, height, placed, spacing, centerClearance, centerX, centerY, centerSize)) {
                px = tx;
                py = ty;
                placed_success = true;
                break;
              }
            }
          }

          // 第3阶段：扫描线回退
          if (!placed_success) {
            const stepX = width + spacing;
            const stepY = height + spacing;
            
            outer:
            for (let y = 0; y < window.innerHeight - height; y += stepY * 0.5) {
              for (let x = 0; x < window.innerWidth - width; x += stepX * 0.5) {
                if (isPositionValid(x, y, width, height, placed, spacing, centerClearance, centerX, centerY, centerSize)) {
                  px = x;
                  py = y;
                  placed_success = true;
                  break outer;
                }
              }
            }
          }

          // 第4阶段：放宽间距
          if (!placed_success) {
            const relaxedSpacing = Math.floor(spacing * 0.5);
            for (let attempt = 0; attempt < 2000; attempt++) {
              const tx = Math.random() * (window.innerWidth - width);
              const ty = Math.random() * (window.innerHeight - height);
              if (isPositionValid(tx, ty, width, height, placed, relaxedSpacing, centerClearance * 0.7, centerX, centerY, centerSize)) {
                px = tx;
                py = ty;
                placed_success = true;
                break;
              }
            }
          }

          // 最终回退
          if (!placed_success) {
            px = Math.random() * (window.innerWidth - width);
            py = Math.random() * (window.innerHeight - height);
          }

          positions[item.index] = { x: px, y: py };
          placed.push({
            left: px,
            top: py,
            right: px + width,
            bottom: py + height
          });
        }

        return positions;
      }

      // 渲染文字
      function renderWords(positions) {
        container.innerHTML = '';
        const fragment = document.createDocumentFragment();

        words.forEach((word, index) => {
          const pos = positions[index];
          if (!pos) return;

          const div = document.createElement('div');
          div.className = 'word';
          div.textContent = word;
          div.style.left = `${pos.x}px`;
          div.style.top = `${pos.y}px`;

          fragment.appendChild(div);
        });

        container.appendChild(fragment);

        const wordElements = container.querySelectorAll('.word');
        wordElements.forEach((el, idx) => {
          setTimeout(() => {
            el.classList.add('show');
          }, idx * 60 + 200);
      });
      }

      function layoutAll() {
        const { sizes, centerSize } = measureAllWords();
        const positions = generateLayout(sizes, centerSize);
        renderWords(positions);
        centerTextEl.style.opacity = '1';
      }

      let resizeTimer;
      function onResize() {
        clearTimeout(resizeTimer);
        const allWords = container.querySelectorAll('.word');
        allWords.forEach(el => el.classList.remove('show'));
        centerTextEl.style.opacity = '0';

        resizeTimer = setTimeout(() => {
          layoutAll();
        }, 600);
      }

      window.addEventListener('load', () => {
        centerTextEl.style.opacity = '0';
        setTimeout(layoutAll, 300);
      });

      window.addEventListener('resize', onResize);
      window.addEventListener('orientationchange', () => {
        setTimeout(onResize, 300);
      });
    })();
  </script>
</body>
</html>
