<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>喜欢徐依晨的全部 · 均匀分布</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0a0a0c;
      font-family: "KaiTi", "STKaiti", "SimSun", "Microsoft YaHei", "Noto Serif SC", serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    /* 中心主文字 - 白色 */
    .center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-weight: 400;
      font-style: italic;
      opacity: 0;
      transition: opacity 1s ease;
      z-index: 15;
      color: #ffffff;
      text-shadow: 0 0 40px rgba(255, 255, 255, 0.8), 0 0 80px rgba(255, 255, 255, 0.4), 0 0 120px rgba(200, 200, 255, 0.3);
      letter-spacing: 4px;
      white-space: nowrap;
      background: radial-gradient(circle, rgba(0,0,0,0.7) 0%, transparent 70%);
      padding: 0.4em 0.8em;
      border-radius: 60px;
      backdrop-filter: blur(2px);
      line-height: 1.3;
    }

    /* 漂浮词汇 - 白色 */
    .word {
      position: absolute;
      opacity: 0;
      transition: opacity 0.9s cubic-bezier(0.23, 1, 0.32, 1);
      font-style: italic;
      white-space: nowrap;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.6), 0 0 40px rgba(200, 200, 255, 0.4), 0 0 60px rgba(255, 255, 255, 0.3);
      letter-spacing: 2.5px;
      font-weight: 300;
      backdrop-filter: blur(1px);
      pointer-events: none;
      will-change: transform, opacity;
      z-index: 5;
    }

    .word.show {
      opacity: 0.9;
      animation: gentleFloat 6s infinite alternate ease-in-out;
    }

    @keyframes gentleFloat {
      0% {
        transform: translate(0, 0) scale(1);
      }
      100% {
        transform: translate(8px, -10px) scale(1.02);
      }
    }

    /* 响应式字号：均已增加5px */
    @media (max-width: 480px) {
      .center-text { font-size: 34px; }
      .word { font-size: 26px; }
    }
    @media (min-width: 481px) and (max-width: 768px) {
      .center-text { font-size: 40px; }
      .word { font-size: 30px; }
    }
    @media (min-width: 769px) and (max-width: 1024px) {
      .center-text { font-size: 48px; }
      .word { font-size: 36px; }
    }
    @media (min-width: 1025px) and (max-width: 2000px) {
      .center-text { font-size: 56px; }
      .word { font-size: 44px; }
    }
    @media (min-width: 2001px) {
      .center-text { font-size: 64px; }
      .word { font-size: 54px; }
    }
  </style>
</head>
<body>
  <div class="center-text" id="centerText">我会喜欢徐依晨的全部</div>
  <div id="wordsContainer"></div>

  <script>
    (function() {
      // 所有词汇（37个）
      const words = [
        "徐依晨的名字", "徐依晨的性格", "徐依晨的样子", "徐依晨的鼻子", "徐依晨的眼睛", 
        "徐依晨的耳朵", "徐依晨的嘴巴", "徐依晨的快乐", "徐依晨的难过", "徐依晨的美丽", 
        "徐依晨的声音", "徐依晨的开朗", "徐依晨的不堪", "徐依晨的优点", "徐依晨的腼腆", 
        "徐依晨的窘迫", "徐依晨的脆弱", "徐依晨的生气", "徐依晨的底线", "徐依晨的古板", 
        "徐依晨的家人", "徐依晨的人格", "徐依晨的家乡", "徐依晨的三观", "徐依晨的嗜好", 
        "徐依晨的灵动", "徐依晨的善良", "徐依晨的经历", "徐依晨的生日", "徐依晨的浪漫", 
        "徐依晨的不甘", "徐依晨的固执", "徐依晨的朋友", "徐依晨的尊严", "徐依晨的天真", 
        "徐依晨的美好", "徐依晨的血型"
      ];

      const container = document.getElementById('wordsContainer');
      
      // 获取当前视口下的字号
      function getCurrentFontSize() {
        const width = window.innerWidth;
        if (width <= 480) return 26;
        if (width <= 768) return 30;
        if (width <= 1024) return 36;
        if (width <= 2000) return 44;
        return 54;
      }

      function getCenterFontSize() {
        const width = window.innerWidth;
        if (width <= 480) return 34;
        if (width <= 768) return 40;
        if (width <= 1024) return 48;
        if (width <= 2000) return 56;
        return 64;
      }

      // 动态测量文字实际占用的宽高
      function measureText(text, fontSize) {
        const span = document.createElement('span');
        span.textContent = text;
        span.style.position = 'absolute';
        span.style.visibility = 'hidden';
        span.style.fontStyle = 'italic';
        span.style.fontFamily = getComputedStyle(document.body).fontFamily;
        span.style.fontSize = `${fontSize}px`;
        span.style.letterSpacing = '2.5px';
        span.style.whiteSpace = 'nowrap';
        span.style.padding = '0';
        span.style.margin = '0';
        document.body.appendChild(span);
        const rect = span.getBoundingClientRect();
        const width = rect.width;
        const height = rect.height;
        document.body.removeChild(span);
        return { width, height };
      }

      // 均匀分布算法：将屏幕分成网格，随机打乱后逐个放置
      function uniformDistribution(wordSizes, centerRect) {
        const viewW = window.innerWidth;
        const viewH = window.innerHeight;
        const margin = Math.max(25, viewW * 0.04);
        
        // 计算可用区域
        const availableWidth = viewW - 2 * margin;
        const availableHeight = viewH - 2 * margin;
        
        // 找出最大词汇尺寸，用于计算网格
        let maxWordWidth = 0;
        let maxWordHeight = 0;
        wordSizes.forEach(size => {
          maxWordWidth = Math.max(maxWordWidth, size.width);
          maxWordHeight = Math.max(maxWordHeight, size.height);
        });
        
        // 计算网格列数和行数（确保足够容纳所有词汇）
        const cols = Math.floor(availableWidth / (maxWordWidth + 30));
        const rows = Math.ceil(words.length / cols);
        
        // 计算实际网格间距
        const cellWidth = availableWidth / cols;
        const cellHeight = Math.min(availableHeight / rows, maxWordHeight + 40);
        
        // 创建网格点列表
        const gridPoints = [];
        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) {
            const centerX = margin + cellWidth * col + cellWidth / 2;
            const centerY = margin + cellHeight * row + cellHeight / 2;
            
            // 检查是否与中心文字重叠
            const wordRect = {
              left: centerX - maxWordWidth / 2,
              top: centerY - maxWordHeight / 2,
              right: centerX + maxWordWidth / 2,
              bottom: centerY + maxWordHeight / 2
            };
            
            const centerBuffer = Math.max(80, viewW * 0.1);
            const overlapsCenter = !(
              wordRect.right + centerBuffer < centerRect.left ||
              wordRect.left - centerBuffer > centerRect.right ||
              wordRect.bottom + centerBuffer < centerRect.top ||
              wordRect.top - centerBuffer > centerRect.bottom
            );
            
            if (!overlapsCenter) {
              gridPoints.push({ centerX, centerY });
            }
          }
        }
        
        // 随机打乱网格点
        for (let i = gridPoints.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [gridPoints[i], gridPoints[j]] = [gridPoints[j], gridPoints[i]];
        }
        
        // 分配词汇到网格点
        const positions = [];
        const shuffledWords = [...words].sort(() => Math.random() - 0.5);
        
        for (let i = 0; i < shuffledWords.length; i++) {
          const word = shuffledWords[i];
          const size = wordSizes.get(word);
          
          if (i < gridPoints.length) {
            const point = gridPoints[i];
            positions.push({
              word: word,
              x: point.centerX - size.width / 2,
              y: point.centerY - size.height / 2,
              width: size.width,
              height: size.height
            });
          } else {
            // 备用：随机放置
            let placed = false;
            for (let attempt = 0; attempt < 500; attempt++) {
              const x = margin + Math.random() * (availableWidth - size.width);
              const y = margin + Math.random() * (availableHeight - size.height);
              
              const rect = {
                left: x,
                top: y,
                right: x + size.width,
                bottom: y + size.height
              };
              
              const centerBuffer = Math.max(80, viewW * 0.1);
              const overlapsCenter = !(
                rect.right + centerBuffer < centerRect.left ||
                rect.left - centerBuffer > centerRect.right ||
                rect.bottom + centerBuffer < centerRect.top ||
                rect.top - centerBuffer > centerRect.bottom
              );
              
              let overlapsOthers = false;
              for (let pos of positions) {
                const otherRect = {
                  left: pos.x,
                  top: pos.y,
                  right: pos.x + pos.width,
                  bottom: pos.y + pos.height
                };
                
                const buffer = 20;
                if (!(rect.right + buffer < otherRect.left ||
                      rect.left - buffer > otherRect.right ||
                      rect.bottom + buffer < otherRect.top ||
                      rect.top - buffer > otherRect.bottom)) {
                  overlapsOthers = true;
                  break;
                }
              }
              
              if (!overlapsCenter && !overlapsOthers) {
                positions.push({
                  word: word,
                  x: x,
                  y: y,
                  width: size.width,
                  height: size.height
                });
                placed = true;
                break;
              }
            }
            
            if (!placed) {
              // 最终兜底
              positions.push({
                word: word,
                x: margin,
                y: margin + (positions.length * 30),
                width: size.width,
                height: size.height
              });
            }
          }
        }
        
        return positions;
      }

      // 渲染所有词汇
      function renderWords() {
        // 移除旧词汇
        while (container.firstChild) {
          container.removeChild(container.firstChild);
        }
        
        const viewW = window.innerWidth;
        const viewH = window.innerHeight;
        const centerFontSize = getCenterFontSize();
        const wordFontSize = getCurrentFontSize();
        
        // 测量中心文字
        const centerTextStr = "我会喜欢徐依晨的全部";
        const centerSize = measureText(centerTextStr, centerFontSize);
        const centerX = viewW / 2;
        const centerY = viewH / 2;
        
        const centerRect = {
          left: centerX - centerSize.width / 2,
          top: centerY - centerSize.height / 2,
          right: centerX + centerSize.width / 2,
          bottom: centerY + centerSize.height / 2
        };
        
        // 测量所有词汇尺寸
        const wordSizes = new Map();
        words.forEach(w => {
          wordSizes.set(w, measureText(w, wordFontSize));
        });
        
        // 使用均匀分布算法获取位置
        const positions = uniformDistribution(wordSizes, centerRect);
        
        // 创建词汇元素
        positions.forEach((pos, index) => {
          const wordDiv = document.createElement('div');
          wordDiv.className = 'word';
          wordDiv.textContent = pos.word;
          wordDiv.style.left = `${pos.x}px`;
          wordDiv.style.top = `${pos.y}px`;
          
          // 随机动画参数
          const duration = 5 + Math.random() * 5;
          const delay = Math.random() * 2;
          wordDiv.style.animationDuration = `${duration}s`;
          wordDiv.style.animationDelay = `${delay}s`;
          
          container.appendChild(wordDiv);
          
          // 依次显现
          setTimeout(() => {
            wordDiv.classList.add('show');
          }, index * 60 + 100);
        });
      }

      // 防抖处理窗口大小变化
      let resizeTimer;
      function handleResize() {
        const allWords = container.querySelectorAll('.word');
        allWords.forEach(el => el.classList.remove('show'));
        
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          renderWords();
        }, 500);
      }

      // 初始化
      window.addEventListener('load', () => {
        const centerEl = document.getElementById('centerText');
        if (centerEl) {
          centerEl.style.opacity = '1';
        }
        setTimeout(renderWords, 300);
      });

      window.addEventListener('resize', handleResize);
      window.addEventListener('orientationchange', () => {
        setTimeout(handleResize, 300);
      });

    })();
  </script>
</body>
</html>
