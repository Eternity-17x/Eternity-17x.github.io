<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>喜欢徐依晨的全部</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: "KaiTi", "STKaiti", "SimSun", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }
    .text-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    .center-text {
      font-size: 32px;
      margin-bottom: 30px;
      font-weight: normal;
      font-style: italic;
    }
    .word {
      position: absolute;
      font-size: 20px;
      opacity: 0;
      transition: opacity 0.8s ease;
      font-style: italic;
      white-space: nowrap;
      /* 给每个文字加上基础的漂浮动画 */
      animation: float 4s ease-in-out infinite alternate;
    }
    .word.show {
      opacity: 1;
    }
    /* 缓慢漂浮的关键帧动画 */
    @keyframes float {
      0% {
        transform: translate(0, 0);
      }
      100% {
        transform: translate(8px, -8px);
      }
    }
  </style>
</head>
<body>
  <div class="text-container">
    <div class="center-text" id="centerText">我会喜欢徐依晨的全部</div>
    <div id="wordsContainer"></div>
  </div>

  <script>
    const words = [
      "徐依晨的名字", "徐依晨的性格", "徐依晨的样子", "徐依晨的鼻子", "徐依晨的眼睛", 
      "徐依晨的耳朵", "徐依晨的嘴巴", "徐依晨的快乐", "徐依晨的难过", "徐依晨的美丽", 
      "徐依晨的声音", "徐依晨的开朗", "徐依晨的不堪", "徐依晨的优点", "徐依晨的腼腆", 
      "徐依晨的窘迫", "徐依晨的脆弱", "徐依晨的生气", "徐依晨的底线", "徐依晨的古板", 
      "徐依晨的家人", "徐依晨的人格", "徐依晨的家乡", "徐依晨的三观", "徐依晨的嗜好", 
      "徐依晨的灵动", "徐依晨的善良", "徐依晨的经历", "徐依晨的生日", "徐依晨的浪漫", 
      "徐依晨的不甘", "徐依晨的固执", "徐依晨的朋友", "徐依晨的尊严", "徐依晨的天真", 
      "徐依晨的美好", "徐依晨的血型"
    ];

    const container = document.getElementById('wordsContainer');
    const centerText = document.getElementById('centerText');

    function initWords() {
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      const minDistFromCenter = 180; // 避开中心文字的距离
      
      words.forEach((word, index) => {
        const div = document.createElement('div');
        div.className = 'word';
        div.textContent = word;
        container.appendChild(div);

        // 生成随机位置，并确保不在中心区域
        let x, y, attempts = 0;
        do {
          x = Math.random() * (window.innerWidth - 100) + 50;
          y = Math.random() * (window.innerHeight - 100) + 50;
          attempts++;
        } while (
          Math.hypot(x - centerX, y - centerY) < minDistFromCenter && 
          attempts < 100
        );

        div.style.left = `${x}px`;
        div.style.top = `${y}px`;

        // 给每个文字随机设置不同的动画时长和延迟，让漂浮更自然不整齐
        const duration = 3 + Math.random() * 2;
        const delay = Math.random() * 2;
        div.style.animationDuration = `${duration}s`;
        div.style.animationDelay = `${delay}s`;

        setTimeout(() => {
          div.classList.add('show');
        }, index * 120);
      });
    }

    setTimeout(() => {
      centerText.style.opacity = '1';
      initWords();
    }, 500);
  </script>
</body>
</html>
