<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>喜欢徐依晨的全部</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: "KaiTi", "STKaiti", "SimSun", "Microsoft YaHei", sans-serif;
      overflow: hidden;
      width: 2560px;
      height: 1600px;
      position: relative;
    }
    /* 中心文字样式 */
    .center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 48px;
      font-weight: normal;
      font-style: italic;
      opacity: 1;
      z-index: 10;
    }
    /* 周围文字样式 */
    .word {
      position: absolute;
      font-size: 32px;
      font-style: italic;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.8s ease;
      animation: float 5s ease-in-out infinite alternate;
    }
    .word.show {
      opacity: 1;
    }
    /* 漂浮动画（减小位移，避免动起来重叠） */
    @keyframes float {
      0% { transform: translate(0, 0); }
      100% { transform: translate(5px, -5px); }
    }
  </style>
</head>
<body>
  <div class="center-text" id="centerText">我会喜欢徐依晨的全部</div>
  <div id="wordsContainer"></div>

  <script>
    const words = [
      "徐依晨的名字", "徐依晨的性格", "徐依晨的样子", "徐依晨的鼻子", "徐依晨的眼睛",
      "徐依晨的耳朵", "徐依晨的嘴巴", "徐依晨的快乐", "徐依晨的难过", "徐依晨的美丽",
      "徐依晨的声音", "徐依晨的开朗", "徐依晨的不堪", "徐依晨的优点", "徐依晨的腼腆",
      "徐依晨的窘迫", "徐依晨的脆弱", "徐依晨的生气", "徐依晨的底线", "徐依晨的古板",
      "徐依晨的家人", "徐依晨的人格", "徐依晨的家乡", "徐依晨的三观", "徐依晨的嗜好",
      "徐依晨的灵动", "徐依晨的善良", "徐依晨的经历", "徐依晨的生日", "徐依晨的浪漫",
      "徐依晨的不甘", "徐依晨的固执", "徐依晨的朋友", "徐依晨的尊严", "徐依晨的天真",
      "徐依晨的美好", "徐依晨的血型"
    ];

    const container = document.getElementById('wordsContainer');
    const centerX = 2560 / 2;  // 固定屏幕宽度
    const centerY = 1600 / 2;  // 固定屏幕高度
    const minDistFromCenter = 300;  // 离中心更远，预留空间
    const wordSpacing = 180;    // 文字之间的最小间距（大于文字尺寸）

    // 获取文字的实际宽高
    function getWordSize(text) {
      const temp = document.createElement('span');
      temp.style.cssText = `font-size:32px; font-family:KaiTi; white-space:nowrap; position:absolute;`;
      temp.textContent = text;
      document.body.appendChild(temp);
      const size = { w: temp.offsetWidth, h: temp.offsetHeight };
      document.body.removeChild(temp);
      return size;
    }

    // 生成不重叠的位置
    function generateValidPosition(wordSize, usedPositions) {
      let attempts = 0;
      while (attempts < 500) {
        // 用“环形分区”均匀分布，避免集中在某区域
        const angle = (attempts % words.length) * (2 * Math.PI / words.length); // 均分角度
        const radius = minDistFromCenter + Math.random() * 800; // 半径范围更大
        let x = centerX + Math.cos(angle) * radius - wordSize.w/2;
        let y = centerY + Math.sin(angle) * radius - wordSize.h/2;

        // 整体左移（按需求）
        x -= 80;

        // 边界检查：文字完全在屏幕内
        if (x < 20 || x + wordSize.w > 2560-20 || y < 20 || y + wordSize.h > 1600-20) {
          attempts++;
          continue;
        }

        // 碰撞检查：和已有的文字不重叠
        let isOverlap = false;
        for (const pos of usedPositions) {
          const dx = Math.abs(x - pos.x);
          const dy = Math.abs(y - pos.y);
          if (dx < wordSpacing && dy < wordSpacing) { // 用固定间距替代尺寸计算，更稳妥
            isOverlap = true;
            break;
          }
        }

        if (!isOverlap) {
          return { x, y };
        }
        attempts++;
      }
      // 极端情况：返回一个默认位置
      return { x: centerX + 500, y: centerY + 500 };
    }

    // 初始化所有文字
    function initWords() {
      const usedPositions = [];
      words.forEach((word, index) => {
        const wordSize = getWordSize(word);
        const pos = generateValidPosition(wordSize, usedPositions);
        usedPositions.push(pos);

        const div = document.createElement('div');
        div.className = 'word';
        div.textContent = word;
        div.style.left = `${pos.x}px`;
        div.style.top = `${pos.y}px`;
        // 随机动画节奏，避免同步移动
        div.style.animationDuration = `${4 + Math.random() * 2}s`;
        div.style.animationDelay = `${Math.random() * 3}s`;
        container.appendChild(div);

        // 逐个显示
        setTimeout(() => div.classList.add('show'), index * 150);
      });
    }

    window.onload = initWords;
  </script>
</body>
</html>
