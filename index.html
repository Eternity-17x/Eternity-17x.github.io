<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>喜欢徐依晨的全部</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: "KaiTi", "STKaiti", "SimSun", "Microsoft YaHei", sans-serif;
      overflow: hidden;
      width: 2560px;
      height: 1600px;
    }

    /* 中心文字样式 */
   .center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 48px; /* 增大中心文字字体 */
      font-weight: normal;
      font-style: italic;
      opacity: 0;
      transition: opacity 0.8s ease;
      z-index: 10; /* 保证中心文字在最上层 */
    }

    /* 周围文字样式 */
   .word {
      position: absolute;
      font-size: 32px; /* 增大周围文字字体 */
      opacity: 0;
      transition: opacity 0.8s ease;
      font-style: italic;
      white-space: nowrap;
      animation: float 4s ease-in-out infinite alternate;
    }

   .word.show {
      opacity: 1;
    }

    /* 缓慢漂浮动画 */
    @keyframes float {
      0% {
        transform: translate(0, 0);
      }

      100% {
        transform: translate(10px, -10px); /* 调整漂浮动画的距离 */
      }
    }
  </style>
</head>

<body>
  <div class="center-text" id="centerText">我会喜欢徐依晨的全部</div>
  <div id="wordsContainer"></div>

  <script>
    // 所有文字内容
    const words = [
      "徐依晨的名字", "徐依晨的性格", "徐依晨的样子", "徐依晨的鼻子", "徐依晨的眼睛",
      "徐依晨的耳朵", "徐依晨的嘴巴", "徐依晨的快乐", "徐依晨的难过", "徐依晨的美丽",
      "徐依晨的声音", "徐依晨的开朗", "徐依晨的不堪", "徐依晨的优点", "徐依晨的腼腆",
      "徐依晨的窘迫", "徐依晨的脆弱", "徐依晨的生气", "徐依晨的底线", "徐依晨的古板",
      "徐依晨的家人", "徐依晨的人格", "徐依晨的家乡", "徐依晨的三观", "徐依晨的嗜好",
      "徐依晨的灵动", "徐依晨的善良", "徐依晨的经历", "徐依晨的生日", "徐依晨的浪漫",
      "徐依晨的不甘", "徐依晨的固执", "徐依晨的朋友", "徐依晨的尊严", "徐依晨的天真",
      "徐依晨的美好", "徐依晨的血型"
    ];

    const container = document.getElementById('wordsContainer');
    const centerText = document.getElementById('centerText');
    const positions = []; // 记录已放置的文字位置，避免重叠

    function initWords() {
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      const minDistFromCenter = 200;
      const minDistBetweenWords = 150; // 增大文字之间的最小距离

      words.forEach((word, index) => {
        const div = document.createElement('div');
        div.className = 'word';
        div.textContent = word;
        container.appendChild(div);

        let validPosition = false;
        let x, y, attempts = 0;

        while (!validPosition && attempts < 150) {
          const angle = Math.random() * 2 * Math.PI;
          const radius = minDistFromCenter + Math.random() * Math.min(window.innerWidth, window.innerHeight) / 3;
          x = centerX + Math.cos(angle) * radius;
          y = centerY + Math.sin(angle) * radius;

          // 边界检查：文字不能跑到屏幕外
          if (x < 60 || x > window.innerWidth - 60 || y < 60 || y > window.innerHeight - 60) {
            attempts++;
            continue;
          }

          // 碰撞检测：检查和已有的文字是否重叠
          let tooClose = false;
          for (const pos of positions) {
            const dist = Math.hypot(x - pos.x, y - pos.y);
            if (dist < minDistBetweenWords) {
              tooClose = true;
              break;
            }
          }

          if (!tooClose) {
            validPosition = true;
            positions.push({ x, y });
          }
          attempts++;
        }

        // 整体往左移动一些
        x -= 100;

        // 设置最终位置
        div.style.left = `${x}px`;
        div.style.top = `${y}px`;

        // 随机漂浮参数，让每个文字的动画节奏不一样
        const duration = 3 + Math.random() * 2;
        const delay = Math.random() * 2;
        div.style.animationDuration = `${duration}s`;
        div.style.animationDelay = `${delay}s`;

        // 逐个显示文字
        setTimeout(() => {
          div.classList.add('show');
        }, index * 100);
      });
    }

    // 页面加载完成后执行
    window.onload = () => {
      // 先显示中心文字
      centerText.style.opacity = '1';
      // 延迟加载周围文字
      setTimeout(initWords, 500);
    };
  </script>
</body>

</html>
