<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 强制适配手机横屏、禁止缩放 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="screen-orientation" content="landscape">
  <meta name="x5-orientation" content="landscape">
  <meta name="360-orientation" content="landscape">
  <title>喜欢徐依晨的全部</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      background: #000;
      color: #fff;
      font-family: "KaiTi", "STKaiti", sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    /* 中心文字 */
    .center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(28px, 6vw, 36px);
      font-style: italic;
      opacity: 0;
      transition: opacity 0.8s ease;
      z-index: 99;
      white-space: nowrap;
    }
    /* 环绕文字 */
    .word {
      position: absolute;
      font-size: clamp(16px, 3.5vw, 20px);
      opacity: 0;
      transition: opacity 0.8s ease;
      font-style: italic;
      white-space: nowrap;
      animation: float 4s ease-in-out infinite alternate;
    }
    .word.show {
      opacity: 1;
    }
    /* 缓慢漂浮动画 */
    @keyframes float {
      0% { transform: translate(0, 0); }
      100% { transform: translate(6px, -6px); }
    }
    /* 强制横屏：竖屏时自动旋转 */
    @media screen and (orientation: portrait) {
      body {
        transform: rotate(90deg);
        transform-origin: center center;
        width: 100vh;
        height: 100vw;
        position: fixed;
        top: 0;
        left: 0;
      }
    }
  </style>
</head>
<body>
  <div class="center-text" id="centerText">我会喜欢徐依晨的全部</div>
  <div id="wordsContainer"></div>

  <script>
    const words = [
      "徐依晨的名字", "徐依晨的性格", "徐依晨的样子", "徐依晨的鼻子", "徐依晨的眼睛",
      "徐依晨的耳朵", "徐依晨的嘴巴", "徐依晨的快乐", "徐依晨的难过", "徐依晨的美丽",
      "徐依晨的声音", "徐依晨的开朗", "徐依晨的不堪", "徐依晨的优点", "徐依晨的腼腆",
      "徐依晨的窘迫", "徐依晨的脆弱", "徐依晨的生气", "徐依晨的底线", "徐依晨的古板",
      "徐依晨的家人", "徐依晨的人格", "徐依晨的家乡", "徐依晨的三观", "徐依晨的嗜好",
      "徐依晨的灵动", "徐依晨的善良", "徐依晨的经历", "徐依晨的生日", "徐依晨的浪漫",
      "徐依晨的不甘", "徐依晨的固执", "徐依晨的朋友", "徐依晨的尊严", "徐依晨的天真",
      "徐依晨的美好", "徐依晨的血型"
    ];

    const container = document.getElementById('wordsContainer');
    const centerText = document.getElementById('centerText');
    let usedPos = [];

    // 核心：环形均匀分布 + 强制防堆叠
    function createWords() {
      usedPos = [];
      container.innerHTML = "";

      const w = Math.max(window.innerWidth, window.innerHeight);
      const h = Math.min(window.innerWidth, window.innerHeight);
      const cx = w / 2;
      const cy = h / 2;

      // 三层环形分布，和视频效果一致
      const rings = [
        { radius: 180, count: 12 },
        { radius: 250, count: 12 },
        { radius: 320, count: 12 }
      ];

      let idx = 0;
      rings.forEach((ring, ringIndex) => {
        const startAngle = (ringIndex * Math.PI * 2) / 3;
        for (let i = 0; i < ring.count && idx < words.length; i++) {
          const item = words[idx];
          const el = document.createElement('div');
          el.className = "word";
          el.innerText = item;
          container.appendChild(el);

          // 环形均匀分布，带轻微随机偏移
          let angle = startAngle + (i / ring.count) * Math.PI * 2;
          let r = ring.radius + (Math.random() - 0.5) * 60;
          let x = cx + Math.cos(angle) * r;
          let y = cy + Math.sin(angle) * r;

          // 边界保护，不让文字跑出屏幕
          if (x < 60) x = 60;
          if (x > w - 60) x = w - 60;
          if (y < 60) y = 60;
          if (y > h - 60) y = h - 60;

          // 碰撞检测：强制保持100px安全距离，不重叠
          let tryTimes = 0;
          while (tryTimes < 200) {
            let overlap = false;
            for (let p of usedPos) {
              const dist = Math.hypot(x - p.x, y - p.y);
              if (dist < 100) {
                overlap = true;
                break;
              }
            }

            if (!overlap) break;

            // 微调角度换位置
            angle += 0.15;
            x = cx + Math.cos(angle) * r;
            y = cy + Math.sin(angle) * r;

            if (x < 60) x = 60;
            if (x > w - 60) x = w - 60;
            if (y < 60) y = 60;
            if (y > h - 60) y = h - 60;

            tryTimes++;
          }

          usedPos.push({ x, y });
          el.style.left = x + "px";
          el.style.top = y + "px";

          // 随机动画节奏，漂浮更自然
          el.style.animationDuration = (3 + Math.random() * 2) + "s";
          el.style.animationDelay = Math.random() + "s";

          setTimeout(() => el.classList.add("show"), idx * 80);
          idx++;
        }
      });
    }

    // 页面加载初始化
    window.addEventListener("load", () => {
      centerText.style.opacity = "1";
      setTimeout(createWords, 400);
    });

    // 屏幕旋转自动重排
    window.addEventListener("resize", () => {
      setTimeout(createWords, 200);
    });
  </script>
</body>
</html>
