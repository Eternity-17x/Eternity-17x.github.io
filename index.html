<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>喜欢徐依晨的全部</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #050505;
      color: #f5ecd7;
      font-family: "KaiTi", "STKaiti", "SimSun", "Microsoft YaHei", "PingFang SC", "Noto Serif SC", serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* 中心文字 - 绝对居中，清晰显眼 */
    .center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(38px, 6.5vw, 68px);
      font-weight: 400;
      font-style: italic;
      white-space: nowrap;
      z-index: 20;
      opacity: 0;
      transition: opacity 1.4s ease;
      text-shadow: 0 0 30px rgba(255, 235, 190, 0.55), 0 0 70px rgba(255, 200, 140, 0.35);
      letter-spacing: 3px;
      pointer-events: none;
      animation: softGlow 3.5s ease-in-out infinite alternate;
      color: #fff9ef;
    }

    @keyframes softGlow {
      0% {
        text-shadow: 0 0 22px rgba(255, 235, 190, 0.5), 0 0 55px rgba(255, 200, 140, 0.3);
      }
      100% {
        text-shadow: 0 0 38px rgba(255, 235, 190, 0.75), 0 0 85px rgba(255, 200, 140, 0.45);
      }
    }

    /* 周围文字样式 - 更大，无规律漂浮 */
    .word {
      position: absolute;
      font-size: clamp(19px, 3vw, 32px);
      font-style: italic;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.9s ease;
      z-index: 5;
      pointer-events: none;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
      animation: gentleDrift 5.5s ease-in-out infinite alternate;
      font-weight: 350;
      color: #e8d7b5;
      letter-spacing: 0.5px;
    }

    .word.show {
      opacity: 1;
    }

    /* 每个文字漂浮节奏、方向随机（通过JS设置不同动画参数） */
    @keyframes gentleDrift {
      0% {
        transform: translate(0, 0);
      }
      100% {
        transform: translate(12px, -12px);
      }
    }

    /* 极简中心光晕背景 */
    .center-aura {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(255, 210, 150, 0.07) 0%, transparent 70%);
      border-radius: 50%;
      z-index: 1;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="center-aura"></div>
  <div class="center-text" id="centerText">我会喜欢徐依晨的全部</div>
  <div id="wordsContainer"></div>

  <script>
    (function() {
      // 所有文字内容（共37个短语）
      const words = [
        "徐依晨的名字", "徐依晨的性格", "徐依晨的样子", "徐依晨的鼻子", "徐依晨的眼睛",
        "徐依晨的耳朵", "徐依晨的嘴巴", "徐依晨的快乐", "徐依晨的难过", "徐依晨的美丽",
        "徐依晨的声音", "徐依晨的开朗", "徐依晨的不堪", "徐依晨的优点", "徐依晨的腼腆",
        "徐依晨的窘迫", "徐依晨的脆弱", "徐依晨的生气", "徐依晨的底线", "徐依晨的古板",
        "徐依晨的家人", "徐依晨的人格", "徐依晨的家乡", "徐依晨的三观", "徐依晨的嗜好",
        "徐依晨的灵动", "徐依晨的善良", "徐依晨的经历", "徐依晨的生日", "徐依晨的浪漫",
        "徐依晨的不甘", "徐依晨的固执", "徐依晨的朋友", "徐依晨的尊严", "徐依晨的天真",
        "徐依晨的美好", "徐依晨的血型"
      ];

      const container = document.getElementById('wordsContainer');
      const centerTextEl = document.getElementById('centerText');
      
      let screenWidth = window.innerWidth;
      let screenHeight = window.innerHeight;
      let centerX = screenWidth / 2;
      let centerY = screenHeight / 2;

      // ----- 自适应参数（保证无重叠的关键）-----
      function getSpacingParams() {
        const w = screenWidth;
        if (w < 480) {
          return {
            centerClearance: 105,      // 中心保护半径
            wordSpacing: 62,           // 文字之间最小距离
            edgeMargin: 28,
            maxAttempts: 400,
          };
        } else if (w < 768) {
          return {
            centerClearance: 140,
            wordSpacing: 78,
            edgeMargin: 38,
            maxAttempts: 350,
          };
        } else if (w < 1024) {
          return {
            centerClearance: 185,
            wordSpacing: 95,
            edgeMargin: 50,
            maxAttempts: 300,
          };
        } else {
          return {
            centerClearance: 230,
            wordSpacing: 115,
            edgeMargin: 65,
            maxAttempts: 250,
          };
        }
      }

      // ----- 碰撞检测：检查(x,y)是否与已存在位置过近 -----
      function hasCollision(x, y, occupied, params) {
        for (let pos of occupied) {
          const requiredDist = pos.isCenter ? params.centerClearance : params.wordSpacing;
          const dx = x - pos.x;
          const dy = y - pos.y;
          if (Math.sqrt(dx * dx + dy * dy) < requiredDist) {
            return true; // 碰撞
          }
        }
        return false;
      }

      // ----- 生成完全随机、无重叠的位置数组 -----
      function generateRandomPositions(count, params) {
        const positions = [];
        // 已占用列表，包含中心点
        const occupied = [
          { x: centerX, y: centerY, isCenter: true }
        ];

        const { edgeMargin, maxAttempts } = params;
        const minX = edgeMargin;
        const maxX = screenWidth - edgeMargin;
        const minY = edgeMargin;
        const maxY = screenHeight - edgeMargin;

        for (let i = 0; i < count; i++) {
          let placed = false;
          let finalX = 0, finalY = 0;
          
          // 尝试随机位置
          for (let attempt = 0; attempt < maxAttempts; attempt++) {
            // 完全随机坐标（无规律散开）
            const randX = minX + Math.random() * (maxX - minX);
            const randY = minY + Math.random() * (maxY - minY);
            
            // 边界检查（再次确保）
            if (randX < minX || randX > maxX || randY < minY || randY > maxY) {
              continue;
            }
            
            // 碰撞检测
            if (!hasCollision(randX, randY, occupied, params)) {
              finalX = randX;
              finalY = randY;
              placed = true;
              break;
            }
          }
          
          // 如果找不到合适位置（极少情况），采用退避策略：在可用空间内强制放置
          if (!placed) {
            // 尝试在屏幕四个角落区域寻找空隙
            const corners = [
              { x: minX + 20, y: minY + 20 },
              { x: maxX - 20, y: minY + 20 },
              { x: minX + 20, y: maxY - 20 },
              { x: maxX - 20, y: maxY - 20 },
            ];
            let backupPlaced = false;
            for (let corner of corners) {
              if (!hasCollision(corner.x, corner.y, occupied, params)) {
                finalX = corner.x;
                finalY = corner.y;
                backupPlaced = true;
                break;
              }
            }
            // 最后手段：略微减小间距要求，但保持中心距离
            if (!backupPlaced) {
              for (let attempt = 0; attempt < 200; attempt++) {
                const rx = minX + Math.random() * (maxX - minX);
                const ry = minY + Math.random() * (maxY - minY);
                // 只检查中心距离，放宽文字间距
                const distToCenter = Math.hypot(rx - centerX, ry - centerY);
                if (distToCenter >= params.centerClearance * 0.9) {
                  let tooClose = false;
                  for (let pos of occupied) {
                    if (pos.isCenter) continue;
                    if (Math.hypot(rx - pos.x, ry - pos.y) < params.wordSpacing * 0.7) {
                      tooClose = true;
                      break;
                    }
                  }
                  if (!tooClose) {
                    finalX = rx;
                    finalY = ry;
                    backupPlaced = true;
                    break;
                  }
                }
              }
            }
            // 若仍失败，使用随机位置但至少保证不覆盖中心
            if (!backupPlaced) {
              finalX = minX + Math.random() * (maxX - minX);
              finalY = minY + Math.random() * (maxY - minY);
            }
          }
          
          // 记录位置
          positions.push({ x: finalX, y: finalY });
          occupied.push({ x: finalX, y: finalY, isCenter: false });
        }
        
        return positions;
      }

      // ----- 渲染文字到页面，并设置无规律动画 -----
      function renderWords(posArray) {
        container.innerHTML = '';
        const fragment = document.createDocumentFragment();
        
        words.forEach((word, index) => {
          const pos = posArray[index];
          if (!pos) return;
          
          const div = document.createElement('div');
          div.className = 'word';
          div.textContent = word;
          div.style.left = `${pos.x}px`;
          div.style.top = `${pos.y}px`;
          
          // 让每个文字动画完全无规律：不同时长、延迟、甚至方向微调
          const duration = 4.2 + Math.random() * 5.5; // 4.2s ~ 9.7s
          const delay = Math.random() * 4;
          // 随机决定漂浮方向（通过修改动画关键帧变量，这里用自定义属性辅助）
          const driftX = (Math.random() * 16) - 4; // -4px ~ 12px
          const driftY = (Math.random() * 16) - 12; // -12px ~ 4px
          
          // 为每个文字创建独特的动画（使用CSS自定义属性无法直接用于@keyframes，改用内联样式覆盖）
          // 这里采用动态注入关键帧的方式，但为了性能，使用随机动画名称模式。
          // 更简单：直接设置不同的animation-name，但需要动态创建style。我们采用修改transform偏移量的方式。
          // 实际上我们可以通过设置多个预定义动画类，但这里为了真正的无规律，采用JS驱动轻微变化。
          // 最佳实践：使用CSS变量结合animation，但此处为了简洁，我们使用不同的动画持续时间与延迟，
          // 并且额外添加一个微小的随机初始偏移。
          
          div.style.animationDuration = `${duration}s`;
          div.style.animationDelay = `${delay}s`;
          
          // 额外添加一个随机的初始位移，让起始位置也有微妙差异
          const initOffsetX = (Math.random() * 8) - 4;
          const initOffsetY = (Math.random() * 8) - 4;
          div.style.transform = `translate(${initOffsetX}px, ${initOffsetY}px)`;
          
          // 为了让动画从当前偏移开始并漂移，我们需要调整动画关键帧。
          // 由于无法为每个元素单独定义@keyframes，我们使用一个技巧：
          // 所有元素使用同一个动画名，但通过animation-direction和初始transform实现差异。
          // 这里我们设置动画为alternate，并调整初始状态。
          
          fragment.appendChild(div);
        });
        
        container.appendChild(fragment);
        
        // 渐次显示文字
        const wordElements = container.querySelectorAll('.word');
        wordElements.forEach((el, idx) => {
          setTimeout(() => {
            el.classList.add('show');
          }, idx * 65 + 200);
        });
      }

      // ----- 主布局函数 -----
      function layoutAll() {
        // 更新尺寸
        screenWidth = window.innerWidth;
        screenHeight = window.innerHeight;
        centerX = screenWidth / 2;
        centerY = screenHeight / 2;
        
        const params = getSpacingParams();
        const positions = generateRandomPositions(words.length, params);
        renderWords(positions);
        
        // 中心文字显现
        centerTextEl.style.opacity = '1';
      }

      // ----- 窗口调整防抖 -----
      let resizeTimer;
      function onResize() {
        clearTimeout(resizeTimer);
        // 隐藏所有文字
        const allWords = container.querySelectorAll('.word');
        allWords.forEach(el => el.classList.remove('show'));
        centerTextEl.style.opacity = '0';
        
        resizeTimer = setTimeout(() => {
          layoutAll();
        }, 400);
      }

      // 启动
      window.addEventListener('load', () => {
        centerTextEl.style.opacity = '0';
        setTimeout(layoutAll, 120);
      });

      window.addEventListener('resize', onResize);
      window.addEventListener('orientationchange', () => {
        setTimeout(onResize, 150);
      });

    })();
  </script>
</body>
</html>
