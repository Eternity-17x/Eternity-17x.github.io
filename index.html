<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>喜欢徐依晨的全部</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;
      color: #f0e6d2;
      font-family: "KaiTi", "STKaiti", "SimSun", "Microsoft YaHei", "PingFang SC", "Noto Serif SC", serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* 中心文字 - 绝对居中 */
    .center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(40px, 7vw, 72px);
      font-weight: 400;
      font-style: italic;
      white-space: nowrap;
      z-index: 20;
      opacity: 0;
      transition: opacity 1.5s ease;
      text-shadow: 0 0 35px rgba(255, 235, 190, 0.6), 0 0 80px rgba(255, 200, 140, 0.4);
      letter-spacing: 4px;
      pointer-events: none;
      animation: centerGlow 4s ease-in-out infinite alternate;
      color: #fffdf5;
    }

    @keyframes centerGlow {
      0% {
        text-shadow: 0 0 25px rgba(255, 235, 190, 0.5), 0 0 60px rgba(255, 200, 140, 0.3);
      }
      100% {
        text-shadow: 0 0 45px rgba(255, 235, 190, 0.8), 0 0 100px rgba(255, 200, 140, 0.5);
      }
    }

    /* 周围文字样式 */
    .word {
      position: absolute;
      font-size: clamp(17px, 2.6vw, 28px);
      font-style: italic;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 1s ease;
      z-index: 5;
      pointer-events: none;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.25);
      font-weight: 350;
      color: #e0d0b0;
      letter-spacing: 1px;
      will-change: transform;
    }

    .word.show {
      opacity: 1;
    }

    /* 中心光晕背景 */
    .center-aura {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(255, 210, 150, 0.06) 0%, transparent 70%);
      border-radius: 50%;
      z-index: 1;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="center-aura"></div>
  <div class="center-text" id="centerText">我会喜欢徐依晨的全部</div>
  <div id="wordsContainer"></div>

  <script>
    (function() {
      const words = [
        "徐依晨的名字", "徐依晨的性格", "徐依晨的样子", "徐依晨的鼻子", "徐依晨的眼睛",
        "徐依晨的耳朵", "徐依晨的嘴巴", "徐依晨的快乐", "徐依晨的难过", "徐依晨的美丽",
        "徐依晨的声音", "徐依晨的开朗", "徐依晨的不堪", "徐依晨的优点", "徐依晨的腼腆",
        "徐依晨的窘迫", "徐依晨的脆弱", "徐依晨的生气", "徐依晨的底线", "徐依晨的古板",
        "徐依晨的家人", "徐依晨的人格", "徐依晨的家乡", "徐依晨的三观", "徐依晨的嗜好",
        "徐依晨的灵动", "徐依晨的善良", "徐依晨的经历", "徐依晨的生日", "徐依晨的浪漫",
        "徐依晨的不甘", "徐依晨的固执", "徐依晨的朋友", "徐依晨的尊严", "徐依晨的天真",
        "徐依晨的美好", "徐依晨的血型"
      ];

      const container = document.getElementById('wordsContainer');
      const centerTextEl = document.getElementById('centerText');

      let screenWidth = window.innerWidth;
      let screenHeight = window.innerHeight;
      let centerX = screenWidth / 2;
      let centerY = screenHeight / 2;

      // 存储所有已放置文字的实际渲染尺寸信息
      let placedRects = [];

      // 获取文字元素的实际占用矩形（考虑字体大小和文字长度）
      function getTextRect(x, y, text, fontSize) {
        // 估算文字宽度：中文字符约等于fontSize宽度，英文和标点约0.5倍
        const charWidth = fontSize * 0.9;
        const textWidth = text.length * charWidth;
        const textHeight = fontSize * 1.2;
        
        return {
          left: x - textWidth / 2,
          top: y - textHeight / 2,
          right: x + textWidth / 2,
          bottom: y + textHeight / 2,
          width: textWidth,
          height: textHeight
        };
      }

      // 检查两个矩形是否重叠（包含缓冲区）
      function rectsOverlap(rect1, rect2, buffer = 15) {
        return !(
          rect1.right + buffer < rect2.left ||
          rect1.left - buffer > rect2.right ||
          rect1.bottom + buffer < rect2.top ||
          rect1.top - buffer > rect2.bottom
        );
      }

      // 获取自适应参数
      function getParams() {
        const w = screenWidth;
        if (w < 480) {
          return {
            centerClearance: 130,
            wordBuffer: 18,
            edgeMargin: 30,
            maxAttempts: 600,
            leftBias: 0.65, // 左偏系数（0-1，越小越偏左）
          };
        } else if (w < 768) {
          return {
            centerClearance: 170,
            wordBuffer: 24,
            edgeMargin: 40,
            maxAttempts: 500,
            leftBias: 0.6,
          };
        } else if (w < 1024) {
          return {
            centerClearance: 220,
            wordBuffer: 30,
            edgeMargin: 55,
            maxAttempts: 400,
            leftBias: 0.55,
          };
        } else {
          return {
            centerClearance: 270,
            wordBuffer: 38,
            edgeMargin: 70,
            maxAttempts: 350,
            leftBias: 0.5,
          };
        }
      }

      // 生成无重叠、偏左的位置
      function generatePositions(count, params) {
        const positions = [];
        placedRects = [];

        const { centerClearance, wordBuffer, edgeMargin, maxAttempts, leftBias } = params;

        // 先添加中心文字占用区域
        const centerFontSize = screenWidth < 480 ? 40 : screenWidth < 768 ? 48 : screenWidth < 1024 ? 58 : 72;
        const centerRect = getTextRect(centerX, centerY, "我会喜欢徐依晨的全部", centerFontSize);
        // 扩大中心保护区域
        const centerProtected = {
          left: centerRect.left - centerClearance,
          top: centerRect.top - centerClearance,
          right: centerRect.right + centerClearance,
          bottom: centerRect.bottom + centerClearance,
          isCenter: true
        };
        placedRects.push(centerProtected);

        // 可用区域范围
        const minX = edgeMargin;
        const maxX = screenWidth - edgeMargin;
        const minY = edgeMargin;
        const maxY = screenHeight - edgeMargin;

        // 预先估算每个文字的大小（使用平均字体大小）
        const avgFontSize = screenWidth < 480 ? 17 : screenWidth < 768 ? 20 : screenWidth < 1024 ? 24 : 28;

        for (let i = 0; i < count; i++) {
          let placed = false;
          let finalX = 0, finalY = 0;

          for (let attempt = 0; attempt < maxAttempts; attempt++) {
            // 使用左偏分布：用幂函数让x坐标倾向于左侧
            // leftBias越小，越偏左。0.5表示均匀，0.3表示强烈偏左
            const xRatio = Math.pow(Math.random(), 1.5 - leftBias * 0.8);
            const yRatio = Math.random();

            const x = minX + xRatio * (maxX - minX);
            const y = minY + yRatio * (maxY - minY);

            // 边界检查
            if (x < minX || x > maxX || y < minY || y > maxY) {
              continue;
            }

            // 计算当前文字的预估矩形
            const wordText = words[i];
            const textRect = getTextRect(x, y, wordText, avgFontSize);

            // 碰撞检测：与所有已放置的矩形比较
            let hasOverlap = false;
            for (const placedRect of placedRects) {
              const buffer = placedRect.isCenter ? centerClearance : wordBuffer;
              if (rectsOverlap(textRect, placedRect, buffer)) {
                hasOverlap = true;
                break;
              }
            }

            if (!hasOverlap) {
              finalX = x;
              finalY = y;
              placed = true;
              break;
            }
          }

          // 如果未找到位置，使用网格退避策略
          if (!placed) {
            // 在屏幕上创建虚拟网格，寻找空位
            const gridSize = avgFontSize * 3;
            const cols = Math.floor((maxX - minX) / gridSize);
            const rows = Math.floor((maxY - minY) / gridSize);
            
            let found = false;
            // 随机打乱网格顺序
            const cells = [];
            for (let r = 0; r < rows; r++) {
              for (let c = 0; c < cols; c++) {
                cells.push({ r, c });
              }
            }
            // Fisher-Yates 洗牌
            for (let k = cells.length - 1; k > 0; k--) {
              const j = Math.floor(Math.random() * (k + 1));
              [cells[k], cells[j]] = [cells[j], cells[k]];
            }

            for (const cell of cells) {
              const gx = minX + cell.c * gridSize + gridSize / 2;
              const gy = minY + cell.r * gridSize + gridSize / 2;
              
              if (gx < minX || gx > maxX || gy < minY || gy > maxY) continue;
              
              const textRect = getTextRect(gx, gy, words[i], avgFontSize);
              let overlap = false;
              for (const placedRect of placedRects) {
                const buffer = placedRect.isCenter ? centerClearance : wordBuffer;
                if (rectsOverlap(textRect, placedRect, buffer)) {
                  overlap = true;
                  break;
                }
              }
              if (!overlap) {
                finalX = gx;
                finalY = gy;
                found = true;
                break;
              }
            }

            if (!found) {
              // 最终回退：放在屏幕角落
              const corners = [
                { x: minX + avgFontSize * 2, y: minY + avgFontSize * 2 },
                { x: maxX - avgFontSize * 2, y: minY + avgFontSize * 2 },
                { x: minX + avgFontSize * 2, y: maxY - avgFontSize * 2 },
                { x: maxX - avgFontSize * 2, y: maxY - avgFontSize * 2 },
              ];
              for (const corner of corners) {
                const textRect = getTextRect(corner.x, corner.y, words[i], avgFontSize);
                let overlap = false;
                for (const placedRect of placedRects) {
                  if (rectsOverlap(textRect, placedRect, wordBuffer * 0.6)) {
                    overlap = true;
                    break;
                  }
                }
                if (!overlap) {
                  finalX = corner.x;
                  finalY = corner.y;
                  found = true;
                  break;
                }
              }
            }

            if (!found) {
              finalX = minX + Math.random() * (maxX - minX);
              finalY = minY + Math.random() * (maxY - minY);
            }
          }

          // 记录位置和占用矩形
          positions.push({ x: finalX, y: finalY });
          const wordText = words[i];
          const finalRect = getTextRect(finalX, finalY, wordText, avgFontSize);
          placedRects.push({ ...finalRect, isCenter: false });
        }

        return positions;
      }

      // 渲染文字
      function renderWords(posArray) {
        container.innerHTML = '';
        const fragment = document.createDocumentFragment();

        words.forEach((word, index) => {
          const pos = posArray[index];
          if (!pos) return;

          const div = document.createElement('div');
          div.className = 'word';
          div.textContent = word;
          div.style.left = `${pos.x}px`;
          div.style.top = `${pos.y}px`;
          div.style.transform = 'translate(-50%, -50%)'; // 以文字中心为定位点

          // 随机漂浮动画参数
          const duration = 5 + Math.random() * 6;
          const delay = Math.random() * 5;
          div.style.animation = `float${Math.floor(Math.random() * 3)} ${duration}s ease-in-out ${delay}s infinite alternate`;

          fragment.appendChild(div);
        });

        container.appendChild(fragment);

        // 渐次显示
        const wordElements = container.querySelectorAll('.word');
        wordElements.forEach((el, idx) => {
          setTimeout(() => {
            el.classList.add('show');
          }, idx * 70 + 200);
        });
      }

      // 动态注入多个漂浮动画
      function injectAnimations() {
        const style = document.createElement('style');
        style.textContent = `
          @keyframes float0 {
            0% { transform: translate(-50%, -50%) translate(0, 0); }
            100% { transform: translate(-50%, -50%) translate(8px, -10px); }
          }
          @keyframes float1 {
            0% { transform: translate(-50%, -50%) translate(0, 0); }
            100% { transform: translate(-50%, -50%) translate(-6px, -8px); }
          }
          @keyframes float2 {
            0% { transform: translate(-50%, -50%) translate(0, 0); }
            100% { transform: translate(-50%, -50%) translate(10px, -12px); }
          }
        `;
        document.head.appendChild(style);
      }

      // 主布局
      function layoutAll() {
        screenWidth = window.innerWidth;
        screenHeight = window.innerHeight;
        centerX = screenWidth / 2;
        centerY = screenHeight / 2;

        const params = getParams();
        const positions = generatePositions(words.length, params);
        renderWords(positions);
        centerTextEl.style.opacity = '1';
      }

      // 防抖重绘
      let resizeTimer;
      function onResize() {
        clearTimeout(resizeTimer);
        const allWords = container.querySelectorAll('.word');
        allWords.forEach(el => el.classList.remove('show'));
        centerTextEl.style.opacity = '0';

        resizeTimer = setTimeout(() => {
          layoutAll();
        }, 500);
      }

      // 初始化
      window.addEventListener('load', () => {
        injectAnimations();
        centerTextEl.style.opacity = '0';
        setTimeout(layoutAll, 150);
      });

      window.addEventListener('resize', onResize);
      window.addEventListener('orientationchange', () => {
        setTimeout(onResize, 200);
      });
    })();
  </script>
</body>
</html>
