<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>喜欢徐依晨的全部</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: "KaiTi", "STKaiti", "SimSun", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }
    /* 中心文字样式 原48px → 51px */
    .center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 51px;
      font-weight: normal;
      font-style: italic;
      opacity: 0;
      transition: opacity 0.8s ease;
      z-index: 10;
      text-shadow: 0 0 30px rgba(255, 235, 190, 0.5), 0 0 60px rgba(255, 200, 140, 0.3);
      letter-spacing: 3px;
    }
    /* 周围文字样式 原36px → 39px */
    .word {
      position: absolute;
      font-size: 39px;
      opacity: 0;
      transition: opacity 0.8s ease;
      font-style: italic;
      white-space: nowrap;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
      letter-spacing: 2px;
    }
    .word.show {
      opacity: 1;
      animation: float 5s ease-in-out infinite alternate;
    }
    /* 缓慢漂浮动画 */
    @keyframes float {
      0% {
        transform: translate(0, 0);
      }
      100% {
        transform: translate(8px, -8px);
      }
    }

    /* 响应式：平板 原40/28 → 43/31 */
    @media (max-width: 1024px) {
      .center-text { font-size: 43px; }
      .word { font-size: 31px; }
    }
    /* 响应式：手机 原32/22 → 35/25 */
    @media (max-width: 768px) {
      .center-text { font-size: 35px; }
      .word { font-size: 25px; }
    }
    /* 小屏手机 原26/18 → 29/21 */
    @media (max-width: 480px) {
      .center-text { font-size: 29px; }
      .word { font-size: 21px; }
    }
  </style>
</head>
<body>
  <div class="center-text" id="centerText">我会喜欢徐依晨的全部</div>
  <div id="wordsContainer"></div>

  <script>
    // 所有文字内容
    const words = [
      "徐依晨的名字", "徐依晨的性格", "徐依晨的样子", "徐依晨的鼻子", "徐依晨的眼睛", 
      "徐依晨的耳朵", "徐依晨的嘴巴", "徐依晨的快乐", "徐依晨的难过", "徐依晨的美丽", 
      "徐依晨的声音", "徐依晨的开朗", "徐依晨的不堪", "徐依晨的优点", "徐依晨的腼腆", 
      "徐依晨的窘迫", "徐依晨的脆弱", "徐依晨的生气", "徐依晨的底线", "徐依晨的古板", 
      "徐依晨的家人", "徐依晨的人格", "徐依晨的家乡", "徐依晨的三观", "徐依晨的嗜好", 
      "徐依晨的灵动", "徐依晨的善良", "徐依晨的经历", "徐依晨的生日", "徐依晨的浪漫", 
      "徐依晨的不甘", "徐依晨的固执", "徐依晨的朋友", "徐依晨的尊严", "徐依晨的天真", 
      "徐依晨的美好", "徐依晨的血型"
    ];

    const container = document.getElementById('wordsContainer');
    const centerText = document.getElementById('centerText');
    let positions = [];

    // 获取自适应参数（大幅加宽安全间距，杜绝重叠）
    function getParams() {
      const w = window.innerWidth;
      if (w < 480) {
        return {
          minDistFromCenter: 120,
          minDistBetweenWords: 80,
          margin: 15,
          maxAttempts: 800,
          leftBias: 0.65,
        };
      } else if (w < 768) {
        return {
          minDistFromCenter: 160,
          minDistBetweenWords: 100,
          margin: 20,
          maxAttempts: 900,
          leftBias: 0.6,
        };
      } else if (w < 1024) {
        return {
          minDistFromCenter: 200,
          minDistBetweenWords: 130,
          margin: 30,
          maxAttempts: 1000,
          leftBias: 0.55,
        };
      } else if (w < 2000) {
        return {
          minDistFromCenter: 260,
          minDistBetweenWords: 160,
          margin: 40,
          maxAttempts: 1200,
          leftBias: 0.5,
        };
      } else {
        return {
          minDistFromCenter: 320,
          minDistBetweenWords: 200,
          margin: 55,
          maxAttempts: 1500,
          leftBias: 0.45,
        };
      }
    }

    // DOM测量文字尺寸
    function measureWord(text, fontSize) {
      const measureEl = document.createElement('span');
      measureEl.textContent = text;
      measureEl.style.cssText = `
        position: absolute;
        visibility: hidden;
        font-style: italic;
        font-family: "KaiTi", "STKaiti", "SimSun", "Microsoft YaHei", sans-serif;
        font-size: ${fontSize}px;
        letter-spacing: 2px;
        white-space: nowrap;
      `;
      document.body.appendChild(measureEl);
      const rect = measureEl.getBoundingClientRect();
      document.body.removeChild(measureEl);
      return { width: rect.width, height: rect.height };
    }

    function getFontSize() {
      const w = window.innerWidth;
      // 所有字号 +3
      if (w < 480) return 21;
      if (w < 768) return 25;
      if (w < 1024) return 31;
      if (w < 2000) return 39;
      return 49;
    }

    // 矩形碰撞检测
    function rectsOverlap(rect1, rect2, buffer) {
      return !(
        rect1.right + buffer < rect2.left ||
        rect1.left - buffer > rect2.right ||
        rect1.bottom + buffer < rect2.top ||
        rect1.top - buffer > rect2.bottom
      );
    }

    function getWordRect(x, y, width, height) {
      return {
        left: x,
        top: y,
        right: x + width,
        bottom: y + height,
        width,
        height,
      };
    }

    function initWords() {
      container.innerHTML = '';
      positions = [];
      
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      const params = getParams();
      const fontSize = getFontSize();
      const { minDistFromCenter, minDistBetweenWords, margin, maxAttempts, leftBias } = params;

      // 中心文字区域 字号+3
      const centerFont = window.innerWidth < 480 ? 29 : 
        window.innerWidth < 768 ? 35 : 
        window.innerWidth < 1024 ? 43 : 51;
      const centerSize = measureWord("我会喜欢徐依晨的全部", centerFont);
      
      positions.push({
        x: centerX,
        y: centerY,
        width: centerSize.width,
        height: centerSize.height,
        isCenter: true,
      });

      // 预测量所有文字
      const wordSizes = {};
      words.forEach(word => {
        wordSizes[word] = measureWord(word, fontSize);
      });

      // 逐个放置文字
      words.forEach((word, index) => {
        const div = document.createElement('div');
        div.className = 'word';
        div.textContent = word;
        container.appendChild(div);

        const wordSize = wordSizes[word];
        let validPosition = false;
        let x, y, attempts = 0;

        // 随机找合法位置（增加尝试次数 + 大间距防重叠）
        while (!validPosition && attempts < maxAttempts) {
          const xRatio = Math.pow(Math.random(), 1.5 + leftBias);
          x = margin + xRatio * (window.innerWidth - margin * 2 - wordSize.width);
          y = margin + Math.random() * (window.innerHeight - margin * 2 - wordSize.height);

          if (x < margin || x + wordSize.width > window.innerWidth - margin ||
              y < margin || y + wordSize.height > window.innerHeight - margin) {
            attempts++;
            continue;
          }

          const newRect = getWordRect(x, y, wordSize.width, wordSize.height);
          let tooClose = false;
          
          for (const pos of positions) {
            const posRect = getWordRect(
              pos.x - (pos.width || 0) / 2,
              pos.y - (pos.height || 0) / 2,
              pos.width || 0,
              pos.height || 0
            );
            const buffer = pos.isCenter ? minDistFromCenter : minDistBetweenWords;
            
            if (rectsOverlap(newRect, posRect, buffer)) {
              tooClose = true;
              break;
            }
          }

          if (!tooClose) {
            validPosition = true;
          }
          attempts++;
        }

        // 兜底：网格扫描布局
        if (!validPosition) {
          const stepX = wordSize.width + minDistBetweenWords;
          const stepY = wordSize.height + minDistBetweenWords;
          
          outer:
          for (let sy = margin; sy < window.innerHeight - margin - wordSize.height; sy += stepY * 0.3) {
            for (let sx = margin; sx < window.innerWidth - margin - wordSize.width; sx += stepX * 0.3) {
              const newRect = getWordRect(sx, sy, wordSize.width, wordSize.height);
              let tooClose = false;
              
              for (const pos of positions) {
                const posRect = getWordRect(
                  pos.x - (pos.width || 0) / 2,
                  pos.y - (pos.height || 0) / 2,
                  pos.width || 0,
                  pos.height || 0
                );
                const buffer = pos.isCenter ? minDistFromCenter : minDistBetweenWords;
                if (rectsOverlap(newRect, posRect, buffer)) {
                  tooClose = true;
                  break outer;
                }
              }
              
              if (!tooClose) {
                x = sx;
                y = sy;
                validPosition = true;
                break outer;
              }
            }
          }
        }

        // 最终兜底
        if (!validPosition) {
          x = margin + Math.random() * (window.innerWidth - margin * 2 - wordSize.width);
          y = margin + Math.random() * (window.innerHeight - margin * 2 - wordSize.height);
        }

        positions.push({
          x: x + wordSize.width / 2,
          y: y + wordSize.height / 2,
          width: wordSize.width,
          height: wordSize.height,
          isCenter: false,
        });

        div.style.left = `${x}px`;
        div.style.top = `${y}px`;

        // 随机漂浮
        const duration = 4 + Math.random() * 4;
        const delay = Math.random() * 3;
        div.style.animationDuration = `${duration}s`;
        div.style.animationDelay = `${delay}s`;

        setTimeout(() => {
          div.classList.add('show');
        }, index * 80);
      });
    }

    window.onload = () => {
      centerText.style.opacity = '1';
      setTimeout(initWords, 500);
    };

    // 窗口缩放重新布局
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      const allWords = container.querySelectorAll('.word');
      allWords.forEach(el => el.classList.remove('show'));
      
      resizeTimer = setTimeout(() => {
        initWords();
      }, 500);
    });
  </script>
</body>
</html>
