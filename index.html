<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>喜欢徐依晨的全部</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: "KaiTi", "STKaiti", "SimSun", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }
    /* 中心文字样式 - 放大 */
    .center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 48px;
      font-weight: normal;
      font-style: italic;
      opacity: 0;
      transition: opacity 0.8s ease;
      z-index: 10;
      text-shadow: 0 0 30px rgba(255, 235, 190, 0.5), 0 0 60px rgba(255, 200, 140, 0.3);
      letter-spacing: 3px;
    }
    /* 周围文字样式 - 大幅放大 */
    .word {
      position: absolute;
      font-size: 36px;
      opacity: 0;
      transition: opacity 0.8s ease;
      font-style: italic;
      white-space: nowrap;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
      letter-spacing: 2px;
      animation: float 4s ease-in-out infinite alternate;
    }
    .word.show {
      opacity: 1;
    }
    /* 缓慢漂浮动画 */
    @keyframes float {
      0% {
        transform: translate(0, 0);
      }
      100% {
        transform: translate(6px, -6px);
      }
    }

    /* 响应式适配 */
    @media (max-width: 1024px) {
      .center-text { font-size: 40px; }
      .word { font-size: 28px; }
    }
    @media (max-width: 768px) {
      .center-text { font-size: 32px; }
      .word { font-size: 22px; }
    }
    @media (max-width: 480px) {
      .center-text { font-size: 26px; }
      .word { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="center-text" id="centerText">我会喜欢徐依晨的全部</div>
  <div id="wordsContainer"></div>

  <script>
    // 所有文字内容
    const words = [
      "徐依晨的名字", "徐依晨的性格", "徐依晨的样子", "徐依晨的鼻子", "徐依晨的眼睛", 
      "徐依晨的耳朵", "徐依晨的嘴巴", "徐依晨的快乐", "徐依晨的难过", "徐依晨的美丽", 
      "徐依晨的声音", "徐依晨的开朗", "徐依晨的不堪", "徐依晨的优点", "徐依晨的腼腆", 
      "徐依晨的窘迫", "徐依晨的脆弱", "徐依晨的生气", "徐依晨的底线", "徐依晨的古板", 
      "徐依晨的家人", "徐依晨的人格", "徐依晨的家乡", "徐依晨的三观", "徐依晨的嗜好", 
      "徐依晨的灵动", "徐依晨的善良", "徐依晨的经历", "徐依晨的生日", "徐依晨的浪漫", 
      "徐依晨的不甘", "徐依晨的固执", "徐依晨的朋友", "徐依晨的尊严", "徐依晨的天真", 
      "徐依晨的美好", "徐依晨的血型"
    ];

    const container = document.getElementById('wordsContainer');
    const centerText = document.getElementById('centerText');
    const positions = [];

    // 获取自适应参数
    function getParams() {
      const w = window.innerWidth;
      if (w < 480) {
        return { minDistFromCenter: 120, minDistBetweenWords: 80, margin: 15 };
      } else if (w < 768) {
        return { minDistFromCenter: 160, minDistBetweenWords: 100, margin: 20 };
      } else if (w < 1024) {
        return { minDistFromCenter: 200, minDistBetweenWords: 130, margin: 30 };
      } else {
        return { minDistFromCenter: 260, minDistBetweenWords: 160, margin: 40 };
      }
    }

    // 测量文字实际尺寸，避免出界
    function measureWord(text, fontSize) {
      const measureEl = document.createElement('span');
      measureEl.textContent = text;
      measureEl.style.cssText = `
        position: absolute; visibility: hidden; font-style: italic;
        font-family: "KaiTi", "STKaiti", "SimSun", "Microsoft YaHei", sans-serif;
        font-size: ${fontSize}px; letter-spacing: 2px; white-space: nowrap;
      `;
      document.body.appendChild(measureEl);
      const rect = measureEl.getBoundingClientRect();
      document.body.removeChild(measureEl);
      return { width: rect.width, height: rect.height };
    }

    function getFontSize() {
      const w = window.innerWidth;
      if (w < 480) return 18;
      if (w < 768) return 22;
      if (w < 1024) return 28;
      return 36;
    }

    function initWords() {
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      const params = getParams();
      const fontSize = getFontSize();
      const { minDistFromCenter, minDistBetweenWords, margin } = params;

      // 预测量所有文字尺寸
      const wordSizes = {};
      words.forEach(word => {
        wordSizes[word] = measureWord(word, fontSize);
      });

      // 中心文字尺寸
      const centerFont = window.innerWidth < 480 ? 26 : 
        window.innerWidth < 768 ? 32 : 
        window.innerWidth < 1024 ? 40 : 48;
      const centerSize = measureWord("我会喜欢徐依晨的全部", centerFont);
      positions.push({
        x: centerX, y: centerY, width: centerSize.width, height: centerSize.height, isCenter: true
      });

      words.forEach((word, index) => {
        const div = document.createElement('div');
        div.className = 'word';
        div.textContent = word;
        container.appendChild(div);

        const wordSize = wordSizes[word];
        let validPosition = false;
        let x, y, attempts = 0;
        const maxAttempts = 1000;

        // 左移偏移量：整体往左移动屏幕宽度的 15%
        const leftOffset = window.innerWidth * 0.15;

        while (!validPosition && attempts < maxAttempts) {
          // 生成围绕中心的随机位置，并整体左移
          const angle = Math.random() * 2 * Math.PI;
          const radius = minDistFromCenter + Math.random() * Math.min(window.innerWidth, window.innerHeight) / 3;
          // 核心修改：x 坐标减去 leftOffset，实现整体左移
          x = centerX + Math.cos(angle) * radius - leftOffset;
          y = centerY + Math.sin(angle) * radius;

          // 边界检查：确保文字不会跑出屏幕
          if (x < margin || x + wordSize.width > window.innerWidth - margin ||
              y < margin || y + wordSize.height > window.innerHeight - margin) {
            attempts++;
            continue;
          }

          // 碰撞检测：防止重叠
          let tooClose = false;
          const newRect = { left: x, top: y, right: x + wordSize.width, bottom: y + wordSize.height };
          for (const pos of positions) {
            const posRect = {
              left: pos.x - (pos.width || 0) / 2,
              top: pos.y - (pos.height || 0) / 2,
              right: pos.x + (pos.width || 0) / 2,
              bottom: pos.y + (pos.height || 0) / 2
            };
            const buffer = pos.isCenter ? minDistFromCenter : minDistBetweenWords;
            if (!(newRect.right + buffer < posRect.left ||
                  newRect.left - buffer > posRect.right ||
                  newRect.bottom + buffer < posRect.top ||
                  newRect.top - buffer > posRect.bottom)) {
              tooClose = true;
              break;
            }
          }

          if (!tooClose) {
            validPosition = true;
            positions.push({
              x: x + wordSize.width / 2,
              y: y + wordSize.height / 2,
              width: wordSize.width,
              height: wordSize.height,
              isCenter: false
            });
          }
          attempts++;
        }

        // 兜底位置（如果找不到合法位置，就放安全区）
        if (!validPosition) {
          x = margin + Math.random() * (window.innerWidth * 0.4 - margin * 2 - wordSize.width);
          y = margin + Math.random() * (window.innerHeight - margin * 2 - wordSize.height);
        }

        div.style.left = `${x}px`;
        div.style.top = `${y}px`;

        // 随机漂浮动画参数
        const duration = 3 + Math.random() * 2;
        const delay = Math.random() * 2;
        div.style.animationDuration = `${duration}s`;
        div.style.animationDelay = `${delay}s`;

        // 逐个显示文字
        setTimeout(() => {
          div.classList.add('show');
        }, index * 100);
      });
    }

    window.onload = () => {
      centerText.style.opacity = '1';
      setTimeout(initWords, 500);
    };

    // 窗口缩放时重新布局
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      const allWords = container.querySelectorAll('.word');
      allWords.forEach(el => el.classList.remove('show'));
      resizeTimer = setTimeout(() => {
        initWords();
      }, 500);
    });
  </script>
</body>
</html>
