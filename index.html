<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>喜欢徐依晨的全部</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;
      color: #f0e6d2;
      font-family: "KaiTi", "STKaiti", "SimSun", "Microsoft YaHei", "PingFang SC", "Noto Serif SC", serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 48px;
      font-weight: 400;
      font-style: italic;
      white-space: nowrap;
      z-index: 20;
      opacity: 0;
      transition: opacity 1.5s ease;
      text-shadow: 0 0 35px rgba(255, 235, 190, 0.6), 0 0 80px rgba(255, 200, 140, 0.4);
      letter-spacing: 4px;
      pointer-events: none;
      animation: centerGlow 4s ease-in-out infinite alternate;
      color: #fffdf5;
    }

    @keyframes centerGlow {
      0% { text-shadow: 0 0 25px rgba(255, 235, 190, 0.5), 0 0 60px rgba(255, 200, 140, 0.3); }
      100% { text-shadow: 0 0 45px rgba(255, 235, 190, 0.8), 0 0 100px rgba(255, 200, 140, 0.5); }
    }

    .word {
      position: absolute;
      font-style: italic;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.8s ease;
      z-index: 5;
      pointer-events: none;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
      font-weight: 350;
      color: #e0d0b0;
      letter-spacing: 2px;
      transform: translate(-50%, -50%);
    }

    .word.show {
      opacity: 1;
    }

    .center-aura {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(255, 210, 150, 0.06) 0%, transparent 70%);
      border-radius: 50%;
      z-index: 1;
      pointer-events: none;
    }

    /* 响应式：针对不同屏幕 */
    @media (min-width: 2000px) {
      .word { font-size: 42px; }
      .center-text { font-size: 52px; }
    }
    @media (min-width: 1400px) and (max-width: 1999px) {
      .word { font-size: 36px; }
      .center-text { font-size: 48px; }
    }
    @media (min-width: 1024px) and (max-width: 1399px) {
      .word { font-size: 30px; }
      .center-text { font-size: 44px; }
    }
    @media (min-width: 768px) and (max-width: 1023px) {
      .word { font-size: 26px; }
      .center-text { font-size: 40px; }
    }
    @media (max-width: 767px) {
      .word { font-size: 22px; }
      .center-text { font-size: 34px; }
    }
  </style>
</head>
<body>
  <div class="center-aura"></div>
  <div class="center-text" id="centerText">我会喜欢徐依晨的全部</div>
  <div id="wordsContainer"></div>

  <script>
    (function() {
      const words = [
        "徐依晨的名字", "徐依晨的性格", "徐依晨的样子", "徐依晨的鼻子", "徐依晨的眼睛",
        "徐依晨的耳朵", "徐依晨的嘴巴", "徐依晨的快乐", "徐依晨的难过", "徐依晨的美丽",
        "徐依晨的声音", "徐依晨的开朗", "徐依晨的不堪", "徐依晨的优点", "徐依晨的腼腆",
        "徐依晨的窘迫", "徐依晨的脆弱", "徐依晨的生气", "徐依晨的底线", "徐依晨的古板",
        "徐依晨的家人", "徐依晨的人格", "徐依晨的家乡", "徐依晨的三观", "徐依晨的嗜好",
        "徐依晨的灵动", "徐依晨的善良", "徐依晨的经历", "徐依晨的生日", "徐依晨的浪漫",
        "徐依晨的不甘", "徐依晨的固执", "徐依晨的朋友", "徐依晨的尊严", "徐依晨的天真",
        "徐依晨的美好", "徐依晨的血型"
      ];

      const container = document.getElementById('wordsContainer');
      const centerTextEl = document.getElementById('centerText');

      // 使用Canvas精确测量文字宽度（不受CSS缩放影响）
      function measureTextCanvas(text, fontStr) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        ctx.font = fontStr;
        const metrics = ctx.measureText(text);
        
        // 获取更精确的边界框
        const actualWidth = metrics.width;
        const actualHeight = metrics.actualBoundingBoxAscent + metrics.actualBoundingBoxDescent;
        
        return {
          width: actualWidth,
          height: Math.max(actualHeight, parseInt(fontStr) * 1.2) // 确保最小高度
        };
      }

      function getFontString(fontSize) {
        return `italic ${fontSize}px "KaiTi", "STKaiti", "SimSun", "Microsoft YaHei", serif`;
      }

      function getCurrentFontSize() {
        const w = window.innerWidth;
        if (w >= 2000) return 42;
        if (w >= 1400) return 36;
        if (w >= 1024) return 30;
        if (w >= 768) return 26;
        return 22;
      }

      function getCenterFontSize() {
        const w = window.innerWidth;
        if (w >= 2000) return 52;
        if (w >= 1400) return 48;
        if (w >= 1024) return 44;
        if (w >= 768) return 40;
        return 34;
      }

      function getLayoutParams() {
        const w = window.innerWidth;
        if (w >= 2000) {
          return {
            centerMinDist: 250,
            wordMinDist: 45,
            edgePadding: 50,
            maxIterations: 5000,
          };
        } else if (w >= 1400) {
          return {
            centerMinDist: 220,
            wordMinDist: 40,
            edgePadding: 40,
            maxIterations: 4000,
          };
        } else if (w >= 1024) {
          return {
            centerMinDist: 190,
            wordMinDist: 35,
            edgePadding: 30,
            maxIterations: 3000,
          };
        } else if (w >= 768) {
          return {
            centerMinDist: 160,
            wordMinDist: 30,
            edgePadding: 25,
            maxIterations: 2500,
          };
        } else {
          return {
            centerMinDist: 130,
            wordMinDist: 25,
            edgePadding: 20,
            maxIterations: 2000,
          };
        }
      }

      // 核心：物理模拟布局算法
      function physicsLayout(wordSizes, centerSize, params) {
        const { centerMinDist, wordMinDist, edgePadding, maxIterations } = params;
        const screenW = window.innerWidth;
        const screenH = window.innerHeight;
        const centerX = screenW / 2;
        const centerY = screenH / 2;

        // 初始化所有文字位置（完全随机散布）
        const particles = words.map((word, i) => {
          const size = wordSizes[word];
          return {
            x: edgePadding + size.width / 2 + Math.random() * (screenW - edgePadding * 2 - size.width),
            y: edgePadding + size.height / 2 + Math.random() * (screenH - edgePadding * 2 - size.height),
            width: size.width,
            height: size.height,
            word: word,
            index: i,
            vx: 0,
            vy: 0
          };
        });

        // 中心文字的边界框
        const centerBox = {
          x: centerX - centerSize.width / 2,
          y: centerY - centerSize.height / 2,
          width: centerSize.width,
          height: centerSize.height,
        };

        // 辅助函数：检查两个盒子是否重叠
        function boxesOverlap(box1, box2, minDist) {
          const ax1 = box1.x - box1.width / 2 - minDist;
          const ax2 = box1.x + box1.width / 2 + minDist;
          const ay1 = box1.y - box1.height / 2 - minDist;
          const ay2 = box1.y + box1.height / 2 + minDist;
          
          const bx1 = box2.x - box2.width / 2 - minDist;
          const bx2 = box2.x + box2.width / 2 + minDist;
          const by1 = box2.y - box2.height / 2 - minDist;
          const by2 = box2.y + box2.height / 2 + minDist;
          
          return !(ax2 < bx1 || ax1 > bx2 || ay2 < by1 || ay1 > by2);
        }

        // 辅助函数：盒子与中心文字是否重叠
        function overlapsCenter(particle) {
          const ax1 = particle.x - particle.width / 2 - centerMinDist;
          const ax2 = particle.x + particle.width / 2 + centerMinDist;
          const ay1 = particle.y - particle.height / 2 - centerMinDist;
          const ay2 = particle.y + particle.height / 2 + centerMinDist;
          
          const bx1 = centerBox.x;
          const bx2 = centerBox.x + centerBox.width;
          const by1 = centerBox.y;
          const by2 = centerBox.y + centerBox.height;
          
          return !(ax2 < bx1 || ax1 > bx2 || ay2 < by1 || ay1 > by2);
        }

        // 检查边界
        function clampToBounds(particle) {
          const halfW = particle.width / 2;
          const halfH = particle.height / 2;
          if (particle.x - halfW < edgePadding) particle.x = edgePadding + halfW;
          if (particle.x + halfW > screenW - edgePadding) particle.x = screenW - edgePadding - halfW;
          if (particle.y - halfH < edgePadding) particle.y = edgePadding + halfH;
          if (particle.y + halfH > screenH - edgePadding) particle.y = screenH - edgePadding - halfH;
        }

        // 主迭代循环
        for (let iter = 0; iter < maxIterations; iter++) {
          let hasOverlap = false;

          // 重置所有力
          particles.forEach(p => { p.vx = 0; p.vy = 0; });

          // 检查每对粒子之间的重叠
          for (let i = 0; i < particles.length; i++) {
            // 与中心文字碰撞
            if (overlapsCenter(particles[i])) {
              hasOverlap = true;
              const dx = particles[i].x - centerX;
              const dy = particles[i].y - centerY;
              const dist = Math.sqrt(dx * dx + dy * dy) || 1;
              const force = 8;
              particles[i].vx += (dx / dist) * force;
              particles[i].vy += (dy / dist) * force;
            }

            // 与其他文字碰撞
            for (let j = i + 1; j < particles.length; j++) {
              if (boxesOverlap(particles[i], particles[j], wordMinDist)) {
                hasOverlap = true;
                const dx = particles[i].x - particles[j].x;
                const dy = particles[i].y - particles[j].y;
                const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                const force = 5;
                const nx = dx / dist;
                const ny = dy / dist;
                
                particles[i].vx += nx * force;
                particles[i].vy += ny * force;
                particles[j].vx -= nx * force;
                particles[j].vy -= ny * force;
              }
            }

            // 边界力
            const halfW = particles[i].width / 2;
            const halfH = particles[i].height / 2;
            if (particles[i].x - halfW < edgePadding) particles[i].vx += 5;
            if (particles[i].x + halfW > screenW - edgePadding) particles[i].vx -= 5;
            if (particles[i].y - halfH < edgePadding) particles[i].vy += 5;
            if (particles[i].y + halfH > screenH - edgePadding) particles[i].vy -= 5;
          }

          if (!hasOverlap) {
            console.log(`布局完成，迭代次数: ${iter + 1}`);
            break;
          }

          // 应用速度并限制在边界内
          particles.forEach(p => {
            p.x += p.vx * 0.6;
            p.y += p.vy * 0.6;
            clampToBounds(p);
          });
        }

        return particles.map(p => ({ x: p.x, y: p.y }));
      }

      // 渲染文字
      function renderWords(positions) {
        container.innerHTML = '';
        const fragment = document.createDocumentFragment();

        words.forEach((word, index) => {
          const pos = positions[index];
          if (!pos) return;

          const div = document.createElement('div');
          div.className = 'word';
          div.textContent = word;
          div.style.left = `${pos.x}px`;
          div.style.top = `${pos.y}px`;

          fragment.appendChild(div);
        });

        container.appendChild(fragment);

        // 渐次显示
        const wordElements = container.querySelectorAll('.word');
        wordElements.forEach((el, idx) => {
          setTimeout(() => {
            el.classList.add('show');
          }, idx * 60 + 200);
        });
      }

      // 主函数
      function layoutAll() {
        const wordFontSize = getCurrentFontSize();
        const centerFontSize = getCenterFontSize();
        const params = getLayoutParams();
        
        const wordFontStr = getFontString(wordFontSize);
        const centerFontStr = getFontString(centerFontSize);
        
        // 使用Canvas精确测量
        const wordSizes = {};
        words.forEach(word => {
          wordSizes[word] = measureTextCanvas(word, wordFontStr);
        });
        
        const centerSize = measureTextCanvas("我会喜欢徐依晨的全部", centerFontStr);
        
        const positions = physicsLayout(wordSizes, centerSize, params);
        renderWords(positions);
        
        centerTextEl.style.opacity = '1';
      }

      // 防抖重绘
      let resizeTimer;
      function onResize() {
        clearTimeout(resizeTimer);
        const allWords = container.querySelectorAll('.word');
        allWords.forEach(el => el.classList.remove('show'));
        centerTextEl.style.opacity = '0';

        resizeTimer = setTimeout(() => {
          layoutAll();
        }, 600);
      }

      // 启动
      window.addEventListener('load', () => {
        centerTextEl.style.opacity = '0';
        setTimeout(layoutAll, 300);
      });

      window.addEventListener('resize', onResize);
      window.addEventListener('orientationchange', () => {
        setTimeout(onResize, 300);
      });
    })();
  </script>
</body>
</html>
