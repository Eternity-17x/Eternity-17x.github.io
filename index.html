<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>喜欢徐依晨的全部</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;
      color: #f0e6d2;
      font-family: "KaiTi", "STKaiti", "SimSun", "Microsoft YaHei", "PingFang SC", "Noto Serif SC", serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* 中心文字 - 字号不变 */
    .center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 48px;
      font-weight: 400;
      font-style: italic;
      white-space: nowrap;
      z-index: 20;
      opacity: 0;
      transition: opacity 1.5s ease;
      text-shadow: 0 0 35px rgba(255, 235, 190, 0.6), 0 0 80px rgba(255, 200, 140, 0.4);
      letter-spacing: 4px;
      pointer-events: none;
      animation: centerGlow 4s ease-in-out infinite alternate;
      color: #fffdf5;
    }

    @keyframes centerGlow {
      0% {
        text-shadow: 0 0 25px rgba(255, 235, 190, 0.5), 0 0 60px rgba(255, 200, 140, 0.3);
      }
      100% {
        text-shadow: 0 0 45px rgba(255, 235, 190, 0.8), 0 0 100px rgba(255, 200, 140, 0.5);
      }
    }

    /* 周围文字 - 进一步放大 */
    .word {
      position: absolute;
      font-size: 32px;
      font-style: italic;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 1s ease;
      z-index: 5;
      pointer-events: none;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
      font-weight: 350;
      color: #e0d0b0;
      letter-spacing: 2px;
      transform: translate(-50%, -50%);
    }

    .word.show {
      opacity: 1;
    }

    /* 测量容器 */
    .measure-container {
      position: absolute;
      visibility: hidden;
      white-space: nowrap;
      font-style: italic;
      pointer-events: none;
      z-index: -999;
    }

    .center-aura {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, rgba(255, 210, 150, 0.08) 0%, transparent 70%);
      border-radius: 50%;
      z-index: 1;
      pointer-events: none;
    }

    /* 响应式调整 */
    @media (max-width: 768px) {
      .center-text {
        font-size: 38px;
      }
      .word {
        font-size: 24px;
      }
    }

    @media (max-width: 480px) {
      .center-text {
        font-size: 32px;
      }
      .word {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="center-aura"></div>
  <div class="center-text" id="centerText">我会喜欢徐依晨的全部</div>
  <div id="wordsContainer"></div>
  <div id="measureContainer" class="measure-container"></div>

  <script>
    (function() {
      const words = [
        "徐依晨的名字", "徐依晨的性格", "徐依晨的样子", "徐依晨的鼻子", "徐依晨的眼睛",
        "徐依晨的耳朵", "徐依晨的嘴巴", "徐依晨的快乐", "徐依晨的难过", "徐依晨的美丽",
        "徐依晨的声音", "徐依晨的开朗", "徐依晨的不堪", "徐依晨的优点", "徐依晨的腼腆",
        "徐依晨的窘迫", "徐依晨的脆弱", "徐依晨的生气", "徐依晨的底线", "徐依晨的古板",
        "徐依晨的家人", "徐依晨的人格", "徐依晨的家乡", "徐依晨的三观", "徐依晨的嗜好",
        "徐依晨的灵动", "徐依晨的善良", "徐依晨的经历", "徐依晨的生日", "徐依晨的浪漫",
        "徐依晨的不甘", "徐依晨的固执", "徐依晨的朋友", "徐依晨的尊严", "徐依晨的天真",
        "徐依晨的美好", "徐依晨的血型"
      ];

      const container = document.getElementById('wordsContainer');
      const centerTextEl = document.getElementById('centerText');
      const measureContainer = document.getElementById('measureContainer');

      let screenWidth = window.innerWidth;
      let screenHeight = window.innerHeight;
      let centerX = screenWidth / 2;
      let centerY = screenHeight / 2;

      // 存储每个已放置元素的信息
      let placedElements = [];

      // 实际测量文字尺寸
      function measureText(text, fontSize, letterSpacing) {
        const measureEl = document.createElement('span');
        measureEl.textContent = text;
        measureEl.style.fontSize = fontSize + 'px';
        measureEl.style.fontFamily = getComputedStyle(document.body).fontFamily;
        measureEl.style.fontStyle = 'italic';
        measureEl.style.letterSpacing = letterSpacing + 'px';
        measureEl.style.position = 'absolute';
        measureEl.style.visibility = 'hidden';
        measureEl.style.whiteSpace = 'nowrap';
        document.body.appendChild(measureEl);
        
        const rect = measureEl.getBoundingClientRect();
        const width = rect.width;
        const height = rect.height;
        
        document.body.removeChild(measureEl);
        
        return { width, height };
      }

      // 获取当前字体大小
      function getWordFontSize() {
        if (screenWidth <= 480) return 20;
        if (screenWidth <= 768) return 24;
        return 32;
      }

      function getCenterFontSize() {
        if (screenWidth <= 480) return 32;
        if (screenWidth <= 768) return 38;
        return 48;
      }

      // 获取布局参数
      function getLayoutParams() {
        if (screenWidth <= 480) {
          return {
            centerMinDist: 120,
            wordMinDist: 35,
            edgePadding: 15,
            maxIterations: 2000,
          };
        } else if (screenWidth <= 768) {
          return {
            centerMinDist: 150,
            wordMinDist: 45,
            edgePadding: 20,
            maxIterations: 1500,
          };
        } else {
          return {
            centerMinDist: 180,
            wordMinDist: 55,
            edgePadding: 30,
            maxIterations: 1000,
          };
        }
      }

      // 核心算法：力导向布局 + 碰撞检测
      function calculatePositions(wordSizes, centerSize, params) {
        const { centerMinDist, wordMinDist, edgePadding, maxIterations } = params;
        
        // 初始化所有文字位置（随机散布，偏左）
        const points = [];
        const velocities = [];
        
        words.forEach((word, index) => {
          const size = wordSizes[word];
          // 初始位置：偏左的随机分布
          const x = edgePadding + size.width/2 + Math.pow(Math.random(), 0.7) * (screenWidth - edgePadding * 2 - size.width);
          const y = edgePadding + size.height/2 + Math.random() * (screenHeight - edgePadding * 2 - size.height);
          
          points.push({ x, y, width: size.width, height: size.height, index });
          velocities.push({ vx: 0, vy: 0 });
        });

        // 力导向迭代：推开重叠的文字
        for (let iteration = 0; iteration < maxIterations; iteration++) {
          let hasOverlap = false;
          
          // 重置速度
          velocities.forEach(v => { v.vx = 0; v.vy = 0; });
          
          // 计算排斥力
          for (let i = 0; i < points.length; i++) {
            // 与中心文字的排斥力
            const dxCenter = points[i].x - centerX;
            const dyCenter = points[i].y - centerY;
            const distToCenter = Math.sqrt(dxCenter * dxCenter + dyCenter * dyCenter);
            
            const requiredCenterDist = centerMinDist + Math.max(points[i].width, points[i].height) / 2;
            
            if (distToCenter < requiredCenterDist && distToCenter > 0) {
              hasOverlap = true;
              const force = (requiredCenterDist - distToCenter) / requiredCenterDist * 2;
              const nx = dxCenter / distToCenter;
              const ny = dyCenter / distToCenter;
              velocities[i].vx += nx * force;
              velocities[i].vy += ny * force;
            }
            
            // 与其他文字的排斥力
            for (let j = i + 1; j < points.length; j++) {
              const dx = points[i].x - points[j].x;
              const dy = points[i].y - points[j].y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              
              const minDist = wordMinDist + (points[i].width + points[j].width) / 4;
              
              if (dist < minDist && dist > 0) {
                hasOverlap = true;
                const force = (minDist - dist) / minDist * 1.5;
                const nx = dx / dist;
                const ny = dy / dist;
                
                velocities[i].vx += nx * force;
                velocities[i].vy += ny * force;
                velocities[j].vx -= nx * force;
                velocities[j].vy -= ny * force;
              }
            }
            
            // 边界排斥力
            const leftDist = points[i].x - points[i].width/2 - edgePadding;
            const rightDist = screenWidth - edgePadding - (points[i].x + points[i].width/2);
            const topDist = points[i].y - points[i].height/2 - edgePadding;
            const bottomDist = screenHeight - edgePadding - (points[i].y + points[i].height/2);
            
            if (leftDist < 0) velocities[i].vx += 1;
            if (rightDist < 0) velocities[i].vx -= 1;
            if (topDist < 0) velocities[i].vy += 1;
            if (bottomDist < 0) velocities[i].vy -= 1;
          }
          
          if (!hasOverlap) break;
          
          // 应用速度（带阻尼）
          const damping = 0.5;
          points.forEach((point, i) => {
            point.x += velocities[i].vx * damping;
            point.y += velocities[i].vy * damping;
            
            // 限制在边界内
            point.x = Math.max(edgePadding + point.width/2, Math.min(screenWidth - edgePadding - point.width/2, point.x));
            point.y = Math.max(edgePadding + point.height/2, Math.min(screenHeight - edgePadding - point.height/2, point.y));
          });
        }
        
        return points.map(p => ({ x: p.x, y: p.y }));
      }

      // 渲染文字
      function renderWords(positions) {
        container.innerHTML = '';
        const fragment = document.createDocumentFragment();

        words.forEach((word, index) => {
          const pos = positions[index];
          if (!pos) return;

          const div = document.createElement('div');
          div.className = 'word';
          div.textContent = word;
          div.style.left = `${pos.x}px`;
          div.style.top = `${pos.y}px`;

          fragment.appendChild(div);
        });

        container.appendChild(fragment);

        // 渐次显示
        const wordElements = container.querySelectorAll('.word');
        wordElements.forEach((el, idx) => {
          setTimeout(() => {
            el.classList.add('show');
          }, idx * 80 + 200);
        });
      }

      // 调试：显示文字边界框（可选，用于验证是否重叠）
      function showDebugRects(positions, wordSizes) {
        // 如需查看边界框，取消注释以下代码
        /*
        positions.forEach((pos, index) => {
          const word = words[index];
          const size = wordSizes[word];
          const rect = document.createElement('div');
          rect.style.cssText = `
            position: absolute;
            left: ${pos.x - size.width/2}px;
            top: ${pos.y - size.height/2}px;
            width: ${size.width}px;
            height: ${size.height}px;
            border: 1px solid rgba(255,0,0,0.5);
            pointer-events: none;
            z-index: 30;
          `;
          document.body.appendChild(rect);
        });
        */
      }

      // 主布局函数
      function layoutAll() {
        screenWidth = window.innerWidth;
        screenHeight = window.innerHeight;
        centerX = screenWidth / 2;
        centerY = screenHeight / 2;

        const wordFontSize = getWordFontSize();
        const centerFontSize = getCenterFontSize();
        const params = getLayoutParams();
        
        // 测量所有文字的实际尺寸
        const wordSizes = {};
        words.forEach(word => {
          wordSizes[word] = measureText(word, wordFontSize, 2);
        });
        
        const centerSize = measureText("我会喜欢徐依晨的全部", centerFontSize, 4);
        
        // 使用力导向算法计算位置
        const positions = calculatePositions(wordSizes, centerSize, params);
        
        // 渲染文字
        renderWords(positions);
        
        // 可选：显示调试边界框
        // showDebugRects(positions, wordSizes);
        
        centerTextEl.style.opacity = '1';
      }

      // 防抖重绘
      let resizeTimer;
      function onResize() {
        clearTimeout(resizeTimer);
        const allWords = container.querySelectorAll('.word');
        allWords.forEach(el => el.classList.remove('show'));
        centerTextEl.style.opacity = '0';

        resizeTimer = setTimeout(() => {
          layoutAll();
        }, 500);
      }

      // 初始化
      window.addEventListener('load', () => {
        centerTextEl.style.opacity = '0';
        setTimeout(layoutAll, 300);
      });

      window.addEventListener('resize', onResize);
      window.addEventListener('orientationchange', () => {
        setTimeout(onResize, 300);
      });
    })();
  </script>
</body>
</html>
