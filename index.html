<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>喜欢徐依晨的全部</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: "KaiTi", "STKaiti", "SimSun", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }
    .center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 32px;
      font-weight: normal;
      font-style: italic;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    .word {
      position: absolute;
      font-size: 20px;
      opacity: 0;
      transition: opacity 0.8s ease;
      font-style: italic;
      white-space: nowrap;
      /* 缓慢漂浮动画 */
      animation: float 4s ease-in-out infinite alternate;
    }
    .word.show {
      opacity: 1;
    }
    @keyframes float {
      0% {
        transform: translate(0, 0);
      }
      100% {
        transform: translate(8px, -8px);
      }
    }
  </style>
</head>
<body>
  <div class="center-text" id="centerText">我会喜欢徐依晨的全部</div>
  <div id="wordsContainer"></div>

  <script>
    const words = [
      "徐依晨的名字", "徐依晨的性格", "徐依晨的样子", "徐依晨的鼻子", "徐依晨的眼睛", 
      "徐依晨的耳朵", "徐依晨的嘴巴", "徐依晨的快乐", "徐依晨的难过", "徐依晨的美丽", 
      "徐依晨的声音", "徐依晨的开朗", "徐依晨的不堪", "徐依晨的优点", "徐依晨的腼腆", 
      "徐依晨的窘迫", "徐依晨的脆弱", "徐依晨的生气", "徐依晨的底线", "徐依晨的古板", 
      "徐依晨的家人", "徐依晨的人格", "徐依晨的家乡", "徐依晨的三观", "徐依晨的嗜好", 
      "徐依晨的灵动", "徐依晨的善良", "徐依晨的经历", "徐依晨的生日", "徐依晨的浪漫", 
      "徐依晨的不甘", "徐依晨的固执", "徐依晨的朋友", "徐依晨的尊严", "徐依晨的天真", 
      "徐依晨的美好", "徐依晨的血型"
    ];

    const container = document.getElementById('wordsContainer');
    const centerText = document.getElementById('centerText');
    const positions = []; // 用来记录已经放好的文字位置，避免重叠

    function initWords() {
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      const minDistFromCenter = 200;  // 避开中心文字的最小距离
      const minDistBetweenWords = 100; // 文字之间的最小距离，防止堆叠

      words.forEach((word, index) => {
        const div = document.createElement('div');
        div.className = 'word';
        div.textContent = word;
        container.appendChild(div);

        let validPosition = false;
        let x, y, attempts = 0;

        // 最多尝试100次，找到一个不重叠的位置
        while (!validPosition && attempts < 100) {
          // 用极坐标生成随机位置，保证均匀分布在整个屏幕
          const angle = Math.random() * 2 * Math.PI;
          const radius = minDistFromCenter + Math.random() * Math.min(window.innerWidth, window.innerHeight) / 2.5;
          x = centerX + Math.cos(angle) * radius;
          y = centerY + Math.sin(angle) * radius;

          // 检查是否超出屏幕边界
          if (x < 50 || x > window.innerWidth - 50 || y < 50 || y > window.innerHeight - 50) {
            attempts++;
            continue;
          }

          // 检查是否和已有的文字重叠
          let tooClose = false;
          for (const pos of positions) {
            const dist = Math.hypot(x - pos.x, y - pos.y);
            if (dist < minDistBetweenWords) {
              tooClose = true;
              break;
            }
          }

          if (!tooClose) {
            validPosition = true;
            positions.push({ x, y });
          }
          attempts++;
        }

        // 设置位置
        div.style.left = `${x}px`;
        div.style.top = `${y}px`;

        // 随机设置漂浮动画的时长和延迟，让效果更自然
        const duration = 3 + Math.random() * 2;
        const delay = Math.random() * 2;
        div.style.animationDuration = `${duration}s`;
        div.style.animationDelay = `${delay}s`;

        // 延迟显示文字
        setTimeout(() => {
          div.classList.add('show');
        }, index * 120);
      });
    }

    // 页面加载后，先显示中心文字，再加载周围文字
    setTimeout(() => {
      centerText.style.opacity = '1';
      initWords();
    }, 500);
  </script>
</body>
</html>
