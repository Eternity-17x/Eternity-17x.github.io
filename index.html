<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>喜欢徐依晨的全部 · 粉色</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0a0a0c;
      font-family: "KaiTi", "STKaiti", "SimSun", "Microsoft YaHei", "Noto Serif SC", serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    /* 中心主文字 - 粉色主题 */
    .center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-weight: 400;
      font-style: italic;
      opacity: 0;
      transition: opacity 1s ease;
      z-index: 15;
      color: #ff69b4;
      text-shadow: 0 0 40px rgba(255, 105, 180, 0.8), 0 0 80px rgba(255, 20, 147, 0.5), 0 0 120px rgba(255, 182, 193, 0.4);
      letter-spacing: 4px;
      white-space: nowrap;
      background: radial-gradient(circle, rgba(0,0,0,0.6) 0%, transparent 70%);
      padding: 0.4em 0.8em;
      border-radius: 60px;
      backdrop-filter: blur(2px);
      line-height: 1.3;
    }

    /* 漂浮词汇 - 粉色系 */
    .word {
      position: absolute;
      opacity: 0;
      transition: opacity 0.9s cubic-bezier(0.23, 1, 0.32, 1);
      font-style: italic;
      white-space: nowrap;
      color: #ff69b4;
      text-shadow: 0 0 20px rgba(255, 105, 180, 0.7), 0 0 40px rgba(255, 20, 147, 0.5), 0 0 60px rgba(255, 182, 193, 0.4);
      letter-spacing: 2.5px;
      font-weight: 400;
      backdrop-filter: blur(1px);
      pointer-events: none;
      will-change: transform, opacity;
      z-index: 5;
    }

    .word.show {
      opacity: 0.95;
      animation: gentleFloat 6s infinite alternate ease-in-out;
    }

    @keyframes gentleFloat {
      0% {
        transform: translate(0, 0) scale(1);
      }
      100% {
        transform: translate(10px, -12px) scale(1.02);
      }
    }

    /* 响应式字号：均已增加5px */
    @media (max-width: 480px) {
      .center-text { font-size: 34px; }
      .word { font-size: 26px; }
    }
    @media (min-width: 481px) and (max-width: 768px) {
      .center-text { font-size: 40px; }
      .word { font-size: 30px; }
    }
    @media (min-width: 769px) and (max-width: 1024px) {
      .center-text { font-size: 48px; }
      .word { font-size: 36px; }
    }
    @media (min-width: 1025px) and (max-width: 2000px) {
      .center-text { font-size: 56px; }
      .word { font-size: 44px; }
    }
    @media (min-width: 2001px) {
      .center-text { font-size: 64px; }
      .word { font-size: 54px; }
    }
  </style>
</head>
<body>
  <div class="center-text" id="centerText">我会喜欢徐依晨的全部</div>
  <div id="wordsContainer"></div>

  <script>
    (function() {
      // 所有词汇
      const words = [
        "徐依晨的名字", "徐依晨的性格", "徐依晨的样子", "徐依晨的鼻子", "徐依晨的眼睛", 
        "徐依晨的耳朵", "徐依晨的嘴巴", "徐依晨的快乐", "徐依晨的难过", "徐依晨的美丽", 
        "徐依晨的声音", "徐依晨的开朗", "徐依晨的不堪", "徐依晨的优点", "徐依晨的腼腆", 
        "徐依晨的窘迫", "徐依晨的脆弱", "徐依晨的生气", "徐依晨的底线", "徐依晨的古板", 
        "徐依晨的家人", "徐依晨的人格", "徐依晨的家乡", "徐依晨的三观", "徐依晨的嗜好", 
        "徐依晨的灵动", "徐依晨的善良", "徐依晨的经历", "徐依晨的生日", "徐依晨的浪漫", 
        "徐依晨的不甘", "徐依晨的固执", "徐依晨的朋友", "徐依晨的尊严", "徐依晨的天真", 
        "徐依晨的美好", "徐依晨的血型"
      ];

      const container = document.getElementById('wordsContainer');
      const centerElement = document.getElementById('centerText');
      
      // 存储已放置元素的位置数据
      let placedRects = [];
      
      // 获取当前视口下的字号
      function getCurrentFontSize() {
        const width = window.innerWidth;
        if (width <= 480) return 26;
        if (width <= 768) return 30;
        if (width <= 1024) return 36;
        if (width <= 2000) return 44;
        return 54;
      }

      function getCenterFontSize() {
        const width = window.innerWidth;
        if (width <= 480) return 34;
        if (width <= 768) return 40;
        if (width <= 1024) return 48;
        if (width <= 2000) return 56;
        return 64;
      }

      // 动态测量文字实际占用的宽高
      function measureText(text, fontSize) {
        const span = document.createElement('span');
        span.textContent = text;
        span.style.position = 'absolute';
        span.style.visibility = 'hidden';
        span.style.fontStyle = 'italic';
        span.style.fontFamily = getComputedStyle(document.body).fontFamily;
        span.style.fontSize = `${fontSize}px`;
        span.style.letterSpacing = '2.5px';
        span.style.whiteSpace = 'nowrap';
        span.style.padding = '0';
        span.style.margin = '0';
        document.body.appendChild(span);
        const rect = span.getBoundingClientRect();
        const width = rect.width;
        const height = rect.height;
        document.body.removeChild(span);
        // 添加额外缓冲，确保不紧贴
        return { width: width + 8, height: height + 6 };
      }

      // 构建矩形对象
      function createRect(centerX, centerY, width, height) {
        return {
          left: centerX - width / 2,
          top: centerY - height / 2,
          right: centerX + width / 2,
          bottom: centerY + height / 2,
          width: width,
          height: height,
          centerX: centerX,
          centerY: centerY
        };
      }

      // 获取防重叠的最小间隙
      function getMinGap(isCenterVsWord = false) {
        const w = window.innerWidth;
        if (w <= 480) {
          return isCenterVsWord ? 55 : 45;
        } else if (w <= 768) {
          return isCenterVsWord ? 70 : 55;
        } else if (w <= 1024) {
          return isCenterVsWord ? 85 : 65;
        } else if (w <= 2000) {
          return isCenterVsWord ? 100 : 80;
        } else {
          return isCenterVsWord ? 120 : 95;
        }
      }

      // 检查两个矩形是否重叠（含缓冲区）
      function isOverlapping(rectA, rectB, buffer) {
        return !(
          rectA.right + buffer < rectB.left ||
          rectA.left - buffer > rectB.right ||
          rectA.bottom + buffer < rectB.top ||
          rectA.top - buffer > rectB.bottom
        );
      }

      // 检查新位置是否有效
      function isValidPosition(newRect) {
        // 边界检查
        const margin = Math.max(15, window.innerWidth * 0.03);
        if (newRect.left < margin || newRect.right > window.innerWidth - margin ||
            newRect.top < margin || newRect.bottom > window.innerHeight - margin) {
          return false;
        }
        
        // 与所有已放置矩形检查碰撞
        for (let placed of placedRects) {
          const buffer = placed.isCenter ? getMinGap(true) : getMinGap(false);
          if (isOverlapping(newRect, placed, buffer)) {
            return false;
          }
        }
        return true;
      }

      // 网格扫描算法寻找非重叠位置（更可靠的方法）
      function findPositionByGrid(wordWidth, wordHeight) {
        const viewW = window.innerWidth;
        const viewH = window.innerHeight;
        const margin = Math.max(20, viewW * 0.04);
        
        // 计算网格步长（确保覆盖所有可能位置）
        const stepX = Math.max(15, wordWidth * 0.6);
        const stepY = Math.max(15, wordHeight * 0.6);
        
        // 从不同起始点开始扫描，避免总是从左上角开始
        const startOffsets = [
          { startX: margin, startY: margin },
          { startX: viewW - margin - wordWidth, startY: margin },
          { startX: margin, startY: viewH - margin - wordHeight },
          { startX: viewW - margin - wordWidth, startY: viewH - margin - wordHeight }
        ];
        
        // 尝试每个起始角
        for (let offset of startOffsets) {
          let y = offset.startY;
          while (y <= viewH - margin - wordHeight) {
            let x = offset.startX;
            while (x <= viewW - margin - wordWidth) {
              const newRect = createRect(
                x + wordWidth / 2,
                y + wordHeight / 2,
                wordWidth,
                wordHeight
              );
              
              if (isValidPosition(newRect)) {
                return { x: x, y: y };
              }
              x += stepX;
            }
            y += stepY;
          }
        }
        
        return null;
      }

      // 随机采样算法（作为补充）
      function findPositionByRandom(wordWidth, wordHeight) {
        const viewW = window.innerWidth;
        const viewH = window.innerHeight;
        const margin = Math.max(20, viewW * 0.04);
        const maxAttempts = 1500;
        
        for (let attempt = 0; attempt < maxAttempts; attempt++) {
          const x = margin + Math.random() * (viewW - 2 * margin - wordWidth);
          const y = margin + Math.random() * (viewH - 2 * margin - wordHeight);
          
          const newRect = createRect(
            x + wordWidth / 2,
            y + wordHeight / 2,
            wordWidth,
            wordHeight
          );
          
          if (isValidPosition(newRect)) {
            return { x: x, y: y };
          }
        }
        
        return null;
      }

      // 综合寻找位置
      function findNonOverlappingPosition(wordWidth, wordHeight) {
        // 先尝试网格扫描（更可靠）
        const gridResult = findPositionByGrid(wordWidth, wordHeight);
        if (gridResult) return gridResult;
        
        // 再尝试随机采样
        const randomResult = findPositionByRandom(wordWidth, wordHeight);
        if (randomResult) return randomResult;
        
        // 最终兜底：放在安全的角落
        const margin = Math.max(20, window.innerWidth * 0.04);
        return { x: margin, y: margin };
      }

      // 清除并重新生成所有词汇
      function renderWords() {
        // 移除旧词汇
        while (container.firstChild) {
          container.removeChild(container.firstChild);
        }
        placedRects = [];
        
        const viewW = window.innerWidth;
        const viewH = window.innerHeight;
        const centerFontSize = getCenterFontSize();
        const wordFontSize = getCurrentFontSize();
        
        // 测量中心文字实际尺寸
        const centerTextStr = "我会喜欢徐依晨的全部";
        const centerSize = measureText(centerTextStr, centerFontSize);
        const centerX = viewW / 2;
        const centerY = viewH / 2;
        
        // 将中心文字作为第一个已放置矩形
        const centerRect = createRect(centerX, centerY, centerSize.width, centerSize.height);
        centerRect.isCenter = true;
        placedRects.push(centerRect);
        
        // 预测量所有词汇尺寸
        const wordSizeMap = new Map();
        words.forEach(w => {
          wordSizeMap.set(w, measureText(w, wordFontSize));
        });
        
        // 逐个创建并放置词汇
        words.forEach((word, index) => {
          const size = wordSizeMap.get(word);
          const pos = findNonOverlappingPosition(size.width, size.height);
          
          // 创建词汇元素
          const wordDiv = document.createElement('div');
          wordDiv.className = 'word';
          wordDiv.textContent = word;
          wordDiv.style.left = `${pos.x}px`;
          wordDiv.style.top = `${pos.y}px`;
          
          // 记录该词汇矩形
          const wordRect = createRect(
            pos.x + size.width / 2,
            pos.y + size.height / 2,
            size.width,
            size.height
          );
          wordRect.isCenter = false;
          placedRects.push(wordRect);
          
          // 随机动画参数
          const duration = 5.5 + Math.random() * 5;
          const delay = Math.random() * 2.5;
          wordDiv.style.animationDuration = `${duration}s`;
          wordDiv.style.animationDelay = `${delay}s`;
          
          container.appendChild(wordDiv);
          
          // 依次显现
          setTimeout(() => {
            wordDiv.classList.add('show');
          }, index * 80 + 50);
        });
      }

      // 防抖处理窗口大小变化
      let resizeTimer;
      function handleResize() {
        const allWords = container.querySelectorAll('.word');
        allWords.forEach(el => el.classList.remove('show'));
        
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          renderWords();
        }, 400);
      }

      // 初始化显示
      window.addEventListener('load', () => {
        const centerEl = document.getElementById('centerText');
        if (centerEl) {
          centerEl.style.opacity = '1';
        }
        setTimeout(renderWords, 400);
      });

      window.addEventListener('resize', handleResize);
      
      window.addEventListener('orientationchange', () => {
        setTimeout(handleResize, 300);
      });

    })();
  </script>
</body>
</html>
