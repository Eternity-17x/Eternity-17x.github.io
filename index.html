<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>喜欢徐依晨的全部</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;
      color: #f0e6d2;
      font-family: "KaiTi", "STKaiti", "SimSun", "Microsoft YaHei", "PingFang SC", "Noto Serif SC", serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* 中心文字 */
    .center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(48px, 7.5vw, 76px);
      font-weight: 400;
      font-style: italic;
      white-space: nowrap;
      z-index: 20;
      opacity: 0;
      transition: opacity 1.5s ease;
      text-shadow: 0 0 35px rgba(255, 235, 190, 0.6), 0 0 80px rgba(255, 200, 140, 0.4);
      letter-spacing: 4px;
      pointer-events: none;
      animation: centerGlow 4s ease-in-out infinite alternate;
      color: #fffdf5;
    }

    @keyframes centerGlow {
      0% {
        text-shadow: 0 0 25px rgba(255, 235, 190, 0.5), 0 0 60px rgba(255, 200, 140, 0.3);
      }
      100% {
        text-shadow: 0 0 45px rgba(255, 235, 190, 0.8), 0 0 100px rgba(255, 200, 140, 0.5);
      }
    }

    /* 周围文字 */
    .word {
      position: absolute;
      font-size: clamp(22px, 3.2vw, 34px);
      font-style: italic;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 1s ease;
      z-index: 5;
      pointer-events: none;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.25);
      font-weight: 350;
      color: #e0d0b0;
      letter-spacing: 1px;
      transform: translate(-50%, -50%);
    }

    .word.show {
      opacity: 1;
    }

    /* 测量用的隐藏容器 */
    .measure-container {
      position: absolute;
      visibility: hidden;
      white-space: nowrap;
      font-style: italic;
      pointer-events: none;
      z-index: -999;
    }

    .center-aura {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 240px;
      height: 240px;
      background: radial-gradient(circle, rgba(255, 210, 150, 0.06) 0%, transparent 70%);
      border-radius: 50%;
      z-index: 1;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="center-aura"></div>
  <div class="center-text" id="centerText">我会喜欢徐依晨的全部</div>
  <div id="wordsContainer"></div>
  <div id="measureContainer" class="measure-container"></div>

  <script>
    (function() {
      const words = [
        "徐依晨的名字", "徐依晨的性格", "徐依晨的样子", "徐依晨的鼻子", "徐依晨的眼睛",
        "徐依晨的耳朵", "徐依晨的嘴巴", "徐依晨的快乐", "徐依晨的难过", "徐依晨的美丽",
        "徐依晨的声音", "徐依晨的开朗", "徐依晨的不堪", "徐依晨的优点", "徐依晨的腼腆",
        "徐依晨的窘迫", "徐依晨的脆弱", "徐依晨的生气", "徐依晨的底线", "徐依晨的古板",
        "徐依晨的家人", "徐依晨的人格", "徐依晨的家乡", "徐依晨的三观", "徐依晨的嗜好",
        "徐依晨的灵动", "徐依晨的善良", "徐依晨的经历", "徐依晨的生日", "徐依晨的浪漫",
        "徐依晨的不甘", "徐依晨的固执", "徐依晨的朋友", "徐依晨的尊严", "徐依晨的天真",
        "徐依晨的美好", "徐依晨的血型"
      ];

      const container = document.getElementById('wordsContainer');
      const centerTextEl = document.getElementById('centerText');
      const measureContainer = document.getElementById('measureContainer');

      let screenWidth = window.innerWidth;
      let screenHeight = window.innerHeight;
      let centerX = screenWidth / 2;
      let centerY = screenHeight / 2;

      // 存储已放置文字的精确矩形
      let placedRects = [];

      // 使用DOM实际测量文字尺寸
      function measureText(text) {
        const measureEl = document.createElement('span');
        measureEl.textContent = text;
        measureEl.style.fontSize = getComputedStyle(document.body).getPropertyValue('font-size');
        // 应用与.word相同的字体大小
        const fontSize = screenWidth < 480 ? '22px' : 
                         screenWidth < 768 ? '25px' : 
                         screenWidth < 1024 ? '30px' : '34px';
        measureEl.style.fontSize = fontSize;
        measureEl.style.fontFamily = getComputedStyle(document.body).fontFamily;
        measureEl.style.fontStyle = 'italic';
        measureContainer.appendChild(measureEl);
        
        const rect = measureEl.getBoundingClientRect();
        const width = rect.width;
        const height = rect.height;
        
        measureContainer.removeChild(measureEl);
        
        return { width, height };
      }

      // 预测量所有文字尺寸
      function measureAllWords() {
        const sizes = {};
        words.forEach(word => {
          sizes[word] = measureText(word);
        });
        return sizes;
      }

      // 获取中心文字的尺寸
      function measureCenterText() {
        const fontSize = screenWidth < 480 ? '48px' : 
                         screenWidth < 768 ? '55px' : 
                         screenWidth < 1024 ? '65px' : '76px';
        const measureEl = document.createElement('span');
        measureEl.textContent = "我会喜欢徐依晨的全部";
        measureEl.style.fontSize = fontSize;
        measureEl.style.fontFamily = getComputedStyle(document.body).fontFamily;
        measureEl.style.fontStyle = 'italic';
        measureContainer.appendChild(measureEl);
        
        const rect = measureEl.getBoundingClientRect();
        const width = rect.width;
        const height = rect.height;
        
        measureContainer.removeChild(measureEl);
        
        return { width, height };
      }

      // 根据文字中心点和尺寸计算矩形
      function getRectFromCenter(cx, cy, width, height) {
        return {
          left: cx - width / 2,
          top: cy - height / 2,
          right: cx + width / 2,
          bottom: cy + height / 2,
          width: width,
          height: height
        };
      }

      // 矩形重叠检测（带缓冲区）
      function rectsOverlap(rect1, rect2, buffer = 20) {
        return !(
          rect1.right + buffer < rect2.left ||
          rect1.left - buffer > rect2.right ||
          rect1.bottom + buffer < rect2.top ||
          rect1.top - buffer > rect2.bottom
        );
      }

      // 获取参数
      function getParams() {
        const w = screenWidth;
        if (w < 480) {
          return {
            centerBuffer: 80,
            wordBuffer: 28,
            edgeMargin: 20,
            maxAttempts: 800,
            leftBias: 0.7,
          };
        } else if (w < 768) {
          return {
            centerBuffer: 100,
            wordBuffer: 34,
            edgeMargin: 28,
            maxAttempts: 700,
            leftBias: 0.65,
          };
        } else if (w < 1024) {
          return {
            centerBuffer: 120,
            wordBuffer: 42,
            edgeMargin: 35,
            maxAttempts: 600,
            leftBias: 0.6,
          };
        } else {
          return {
            centerBuffer: 140,
            wordBuffer: 50,
            edgeMargin: 45,
            maxAttempts: 500,
            leftBias: 0.55,
          };
        }
      }

      // 生成不重叠的偏左位置
      function generatePositions(wordSizes, centerSize, params) {
        const positions = [];
        placedRects = [];

        const { centerBuffer, wordBuffer, edgeMargin, maxAttempts, leftBias } = params;

        // 添加中心文字的占用区域（带缓冲）
        const centerRect = getRectFromCenter(centerX, centerY, centerSize.width, centerSize.height);
        const centerProtected = {
          left: centerRect.left - centerBuffer,
          top: centerRect.top - centerBuffer,
          right: centerRect.right + centerBuffer,
          bottom: centerRect.bottom + centerBuffer,
          isCenter: true
        };
        placedRects.push(centerProtected);

        const minX = edgeMargin;
        const maxX = screenWidth - edgeMargin;
        const minY = edgeMargin;
        const maxY = screenHeight - edgeMargin;

        for (let i = 0; i < words.length; i++) {
          const wordText = words[i];
          const wordSize = wordSizes[wordText];
          let placed = false;
          let finalX = 0, finalY = 0;

          for (let attempt = 0; attempt < maxAttempts; attempt++) {
            // 左偏随机分布
            const xRatio = Math.pow(Math.random(), 1.6 - leftBias * 0.9);
            const yRatio = Math.random();

            const x = minX + xRatio * (maxX - minX);
            const y = minY + yRatio * (maxY - minY);

            // 边界检查
            if (x - wordSize.width / 2 < minX || 
                x + wordSize.width / 2 > maxX ||
                y - wordSize.height / 2 < minY || 
                y + wordSize.height / 2 > maxY) {
              continue;
            }

            // 计算矩形
            const textRect = getRectFromCenter(x, y, wordSize.width, wordSize.height);

            // 碰撞检测
            let hasOverlap = false;
            for (const placedRect of placedRects) {
              const buffer = placedRect.isCenter ? centerBuffer : wordBuffer;
              if (rectsOverlap(textRect, placedRect, buffer)) {
                hasOverlap = true;
                break;
              }
            }

            if (!hasOverlap) {
              finalX = x;
              finalY = y;
              placed = true;
              break;
            }
          }

          // 如果随机放置失败，使用网格搜索
          if (!placed) {
            const gridStepX = wordSize.width + wordBuffer;
            const gridStepY = wordSize.height + wordBuffer;
            
            // 生成所有可能的网格位置
            const candidates = [];
            for (let gx = minX + gridStepX / 2; gx <= maxX - gridStepX / 2; gx += gridStepX * 0.5) {
              for (let gy = minY + gridStepY / 2; gy <= maxY - gridStepY / 2; gy += gridStepY * 0.5) {
                candidates.push({ x: gx, y: gy });
              }
            }
            
            // 优先左侧位置
            candidates.sort((a, b) => a.x - b.x);
            
            // 随机打乱前30%的位置（保持左偏但增加随机性）
            const shuffleCount = Math.floor(candidates.length * 0.3);
            for (let k = shuffleCount - 1; k > 0; k--) {
              const j = Math.floor(Math.random() * (k + 1));
              [candidates[k], candidates[j]] = [candidates[j], candidates[k]];
            }

            for (const candidate of candidates) {
              const textRect = getRectFromCenter(candidate.x, candidate.y, wordSize.width, wordSize.height);
              
              if (textRect.left < minX || textRect.right > maxX || 
                  textRect.top < minY || textRect.bottom > maxY) {
                continue;
              }
              
              let hasOverlap = false;
              for (const placedRect of placedRects) {
                const buffer = placedRect.isCenter ? centerBuffer : wordBuffer;
                if (rectsOverlap(textRect, placedRect, buffer)) {
                  hasOverlap = true;
                  break;
                }
              }
              
              if (!hasOverlap) {
                finalX = candidate.x;
                finalY = candidate.y;
                placed = true;
                break;
              }
            }
          }

          // 最终回退
          if (!placed) {
            finalX = minX + wordSize.width / 2 + Math.random() * (maxX - minX - wordSize.width);
            finalY = minY + wordSize.height / 2 + Math.random() * (maxY - minY - wordSize.height);
          }

          // 记录位置
          positions.push({ x: finalX, y: finalY });
          const finalRect = getRectFromCenter(finalX, finalY, wordSize.width, wordSize.height);
          placedRects.push({ ...finalRect, isCenter: false });
        }

        return positions;
      }

      // 渲染文字
      function renderWords(posArray) {
        container.innerHTML = '';
        const fragment = document.createDocumentFragment();

        words.forEach((word, index) => {
          const pos = posArray[index];
          if (!pos) return;

          const div = document.createElement('div');
          div.className = 'word';
          div.textContent = word;
          div.style.left = `${pos.x}px`;
          div.style.top = `${pos.y}px`;

          // 随机漂浮动画
          const floatType = Math.floor(Math.random() * 4);
          const duration = 6 + Math.random() * 8;
          const delay = Math.random() * 6;
          div.style.animation = `drift${floatType} ${duration}s ease-in-out ${delay}s infinite alternate`;

          fragment.appendChild(div);
        });

        container.appendChild(fragment);

        // 渐次显示
        const wordElements = container.querySelectorAll('.word');
        wordElements.forEach((el, idx) => {
          setTimeout(() => {
            el.classList.add('show');
          }, idx * 60 + 200);
        });
      }

      // 注入漂浮动画
      function injectAnimations() {
        const style = document.createElement('style');
        style.textContent = `
          @keyframes drift0 {
            0% { transform: translate(-50%, -50%) translate(0, 0); }
            100% { transform: translate(-50%, -50%) translate(10px, -12px); }
          }
          @keyframes drift1 {
            0% { transform: translate(-50%, -50%) translate(0, 0); }
            100% { transform: translate(-50%, -50%) translate(-8px, -10px); }
          }
          @keyframes drift2 {
            0% { transform: translate(-50%, -50%) translate(0, 0); }
            100% { transform: translate(-50%, -50%) translate(12px, -8px); }
          }
          @keyframes drift3 {
            0% { transform: translate(-50%, -50%) translate(0, 0); }
            100% { transform: translate(-50%, -50%) translate(-10px, -14px); }
          }
        `;
        document.head.appendChild(style);
      }

      // 主布局函数
      function layoutAll() {
        screenWidth = window.innerWidth;
        screenHeight = window.innerHeight;
        centerX = screenWidth / 2;
        centerY = screenHeight / 2;

        const params = getParams();
        const wordSizes = measureAllWords();
        const centerSize = measureCenterText();
        
        const positions = generatePositions(wordSizes, centerSize, params);
        renderWords(positions);
        
        centerTextEl.style.opacity = '1';
      }

      // 防抖重绘
      let resizeTimer;
      function onResize() {
        clearTimeout(resizeTimer);
        const allWords = container.querySelectorAll('.word');
        allWords.forEach(el => el.classList.remove('show'));
        centerTextEl.style.opacity = '0';

        resizeTimer = setTimeout(() => {
          layoutAll();
        }, 500);
      }

      // 初始化
      window.addEventListener('load', () => {
        injectAnimations();
        centerTextEl.style.opacity = '0';
        setTimeout(layoutAll, 200);
      });

      window.addEventListener('resize', onResize);
      window.addEventListener('orientationchange', () => {
        setTimeout(onResize, 300);
      });
    })();
  </script>
</body>
</html>
