<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>喜欢徐依晨的全部 · 力导向布局</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0a0a0c;
      font-family: "KaiTi", "STKaiti", "SimSun", "Microsoft YaHei", "Noto Serif SC", serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    .center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-weight: 400;
      font-style: italic;
      opacity: 0;
      transition: opacity 1s ease;
      z-index: 15;
      color: #ffffff;
      text-shadow: 0 0 40px rgba(255, 255, 255, 0.8), 0 0 80px rgba(255, 255, 255, 0.4);
      letter-spacing: 4px;
      white-space: nowrap;
      background: radial-gradient(circle, rgba(0,0,0,0.7) 0%, transparent 70%);
      padding: 0.4em 0.8em;
      border-radius: 60px;
      backdrop-filter: blur(2px);
      line-height: 1.3;
      pointer-events: none;
    }

    .word {
      position: absolute;
      opacity: 0;
      transition: opacity 0.8s ease;
      font-style: italic;
      white-space: nowrap;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.6), 0 0 40px rgba(200, 200, 255, 0.4);
      letter-spacing: 2.5px;
      font-weight: 300;
      backdrop-filter: blur(1px);
      pointer-events: none;
      will-change: transform, opacity;
      z-index: 5;
    }

    .word.show {
      opacity: 0.9;
      animation: gentleFloat 6s infinite alternate ease-in-out;
    }

    @keyframes gentleFloat {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(8px, -10px) scale(1.02); }
    }

    @media (max-width: 480px) {
      .center-text { font-size: 34px; }
      .word { font-size: 26px; }
    }
    @media (min-width: 481px) and (max-width: 768px) {
      .center-text { font-size: 40px; }
      .word { font-size: 30px; }
    }
    @media (min-width: 769px) and (max-width: 1024px) {
      .center-text { font-size: 48px; }
      .word { font-size: 36px; }
    }
    @media (min-width: 1025px) and (max-width: 2000px) {
      .center-text { font-size: 56px; }
      .word { font-size: 44px; }
    }
    @media (min-width: 2001px) {
      .center-text { font-size: 64px; }
      .word { font-size: 54px; }
    }
  </style>
</head>
<body>
  <div class="center-text" id="centerText">我会喜欢徐依晨的全部</div>
  <div id="wordsContainer"></div>

  <script>
    (function() {
      const words = [
        "徐依晨的名字", "徐依晨的性格", "徐依晨的样子", "徐依晨的鼻子", "徐依晨的眼睛", 
        "徐依晨的耳朵", "徐依晨的嘴巴", "徐依晨的快乐", "徐依晨的难过", "徐依晨的美丽", 
        "徐依晨的声音", "徐依晨的开朗", "徐依晨的不堪", "徐依晨的优点", "徐依晨的腼腆", 
        "徐依晨的窘迫", "徐依晨的脆弱", "徐依晨的生气", "徐依晨的底线", "徐依晨的古板", 
        "徐依晨的家人", "徐依晨的人格", "徐依晨的家乡", "徐依晨的三观", "徐依晨的嗜好", 
        "徐依晨的灵动", "徐依晨的善良", "徐依晨的经历", "徐依晨的生日", "徐依晨的浪漫", 
        "徐依晨的不甘", "徐依晨的固执", "徐依晨的朋友", "徐依晨的尊严", "徐依晨的天真", 
        "徐依晨的美好", "徐依晨的血型"
      ];

      const container = document.getElementById('wordsContainer');
      
      function getCurrentFontSize() {
        const width = window.innerWidth;
        if (width <= 480) return 26;
        if (width <= 768) return 30;
        if (width <= 1024) return 36;
        if (width <= 2000) return 44;
        return 54;
      }

      function getCenterFontSize() {
        const width = window.innerWidth;
        if (width <= 480) return 34;
        if (width <= 768) return 40;
        if (width <= 1024) return 48;
        if (width <= 2000) return 56;
        return 64;
      }

      function measureText(text, fontSize) {
        const span = document.createElement('span');
        span.textContent = text;
        span.style.position = 'absolute';
        span.style.visibility = 'hidden';
        span.style.fontStyle = 'italic';
        span.style.fontFamily = getComputedStyle(document.body).fontFamily;
        span.style.fontSize = `${fontSize}px`;
        span.style.letterSpacing = '2.5px';
        span.style.whiteSpace = 'nowrap';
        document.body.appendChild(span);
        const rect = span.getBoundingClientRect();
        document.body.removeChild(span);
        return { width: rect.width, height: rect.height };
      }

      // 力导向布局算法
      function forceDirectedLayout(wordData, centerRect, viewW, viewH) {
        const nodes = wordData.map(data => ({
          ...data,
          x: Math.random() * viewW,
          y: Math.random() * viewH,
          vx: 0,
          vy: 0
        }));

        const margin = 30;
        const iterations = 500; // 迭代次数
        const repulsionStrength = 5000; // 排斥力强度
        const damping = 0.9; // 阻尼系数
        const minDistance = 80; // 最小距离

        for (let iter = 0; iter < iterations; iter++) {
          // 重置力
          nodes.forEach(node => {
            node.vx = 0;
            node.vy = 0;
          });

          // 计算排斥力（节点之间）
          for (let i = 0; i < nodes.length; i++) {
            for (let j = i + 1; j < nodes.length; j++) {
              const dx = nodes[j].x - nodes[i].x;
              const dy = nodes[j].y - nodes[i].y;
              const distance = Math.sqrt(dx * dx + dy * dy);
              
              if (distance < minDistance && distance > 0) {
                const force = repulsionStrength / (distance * distance);
                const fx = (dx / distance) * force;
                const fy = (dy / distance) * force;
                
                nodes[i].vx -= fx;
                nodes[i].vy -= fy;
                nodes[j].vx += fx;
                nodes[j].vy += fy;
              }
            }
          }

          // 计算与中心的排斥力
          nodes.forEach(node => {
            const dx = node.x - centerRect.x;
            const dy = node.y - centerRect.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            if (distance < centerRect.radius + 50 && distance > 0) {
              const force = repulsionStrength * 2 / (distance * distance);
              node.vx += (dx / distance) * force;
              node.vy += (dy / distance) * force;
            }
          });

          // 边界约束力
          nodes.forEach(node => {
            if (node.x < margin) node.vx += 10;
            if (node.x > viewW - margin) node.vx -= 10;
            if (node.y < margin) node.vy += 10;
            if (node.y > viewH - margin) node.vy -= 10;
          });

          // 更新位置
          nodes.forEach(node => {
            node.vx *= damping;
            node.vy *= damping;
            node.x += node.vx;
            node.y += node.vy;
            
            // 边界限制
            node.x = Math.max(margin, Math.min(viewW - margin, node.x));
            node.y = Math.max(margin, Math.min(viewH - margin, node.y));
          });
        }

        return nodes.map(node => ({
          word: node.word,
          x: node.x - node.width / 2,
          y: node.y - node.height / 2,
          width: node.width,
          height: node.height
        }));
      }

      function renderWords() {
        while (container.firstChild) {
          container.removeChild(container.firstChild);
        }
        
        const viewW = window.innerWidth;
        const viewH = window.innerHeight;
        const centerFontSize = getCenterFontSize();
        const wordFontSize = getCurrentFontSize();
        
        // 中心文字
        const centerTextStr = "我会喜欢徐依晨的全部";
        const centerSize = measureText(centerTextStr, centerFontSize);
        const centerRect = {
          x: viewW / 2,
          y: viewH / 2,
          width: centerSize.width,
          height: centerSize.height,
          radius: Math.max(centerSize.width, centerSize.height) * 0.8
        };
        
        // 测量所有词汇
        const wordData = words.map(word => {
          const size = measureText(word, wordFontSize);
          return {
            word: word,
            width: size.width,
            height: size.height
          };
        });
        
        // 使用力导向布局
        const positions = forceDirectedLayout(wordData, centerRect, viewW, viewH);
        
        // 创建词汇元素
        positions.forEach((pos, index) => {
          const wordDiv = document.createElement('div');
          wordDiv.className = 'word';
          wordDiv.textContent = pos.word;
          wordDiv.style.left = `${pos.x}px`;
          wordDiv.style.top = `${pos.y}px`;
          
          const duration = 5 + Math.random() * 5;
          const delay = Math.random() * 2;
          wordDiv.style.animationDuration = `${duration}s`;
          wordDiv.style.animationDelay = `${delay}s`;
          
          container.appendChild(wordDiv);
          
          setTimeout(() => {
            wordDiv.classList.add('show');
          }, index * 50 + 100);
        });
      }

      let resizeTimer;
      function handleResize() {
        const allWords = container.querySelectorAll('.word');
        allWords.forEach(el => el.classList.remove('show'));
        
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          renderWords();
        }, 500);
      }

      window.addEventListener('load', () => {
        const centerEl = document.getElementById('centerText');
        if (centerEl) {
          centerEl.style.opacity = '1';
        }
        setTimeout(renderWords, 300);
      });

      window.addEventListener('resize', handleResize);
      window.addEventListener('orientationchange', () => {
        setTimeout(handleResize, 300);
      });

    })();
  </script>
</body>
</html>
