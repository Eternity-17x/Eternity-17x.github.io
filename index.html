<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>喜欢徐依晨的全部</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: "KaiTi", "STKaiti", "SimSun", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }
    /* 中心文字样式 - 放大 */
    .center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 42px;
      font-weight: normal;
      font-style: italic;
      opacity: 0;
      transition: opacity 0.8s ease;
      z-index: 10;
      text-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
      letter-spacing: 3px;
    }
    /* 周围文字样式 - 放大 */
    .word {
      position: absolute;
      font-size: 30px;
      opacity: 0;
      transition: opacity 0.8s ease;
      font-style: italic;
      white-space: nowrap;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
      letter-spacing: 2px;
    }
    .word.show {
      opacity: 1;
      animation: float 5s ease-in-out infinite alternate;
    }
    /* 缓慢漂浮动画 */
    @keyframes float {
      0% {
        transform: translate(0, 0);
      }
      100% {
        transform: translate(8px, -8px);
      }
    }

    /* 响应式设计 */
    @media (max-width: 768px) {
      .center-text { font-size: 32px; }
      .word { font-size: 22px; }
    }
    @media (max-width: 480px) {
      .center-text { font-size: 28px; }
      .word { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="center-text" id="centerText">我会喜欢徐依晨的全部</div>
  <div id="wordsContainer"></div>

  <script>
    // 所有文字内容
    const words = [
      "徐依晨的名字", "徐依晨的性格", "徐依晨的样子", "徐依晨的鼻子", "徐依晨的眼睛", 
      "徐依晨的耳朵", "徐依晨的嘴巴", "徐依晨的快乐", "徐依晨的难过", "徐依晨的美丽", 
      "徐依晨的声音", "徐依晨的开朗", "徐依晨的不堪", "徐依晨的优点", "徐依晨的腼腆", 
      "徐依晨的窘迫", "徐依晨的脆弱", "徐依晨的生气", "徐依晨的底线", "徐依晨的古板", 
      "徐依晨的家人", "徐依晨的人格", "徐依晨的家乡", "徐依晨的三观", "徐依晨的嗜好", 
      "徐依晨的灵动", "徐依晨的善良", "徐依晨的经历", "徐依晨的生日", "徐依晨的浪漫", 
      "徐依晨的不甘", "徐依晨的固执", "徐依晨的朋友", "徐依晨的尊严", "徐依晨的天真", 
      "徐依晨的美好", "徐依晨的血型"
    ];

    const container = document.getElementById('wordsContainer');
    const centerText = document.getElementById('centerText');

    // 测量文字实际尺寸
    function measureText(text, fontSize) {
      const measureEl = document.createElement('span');
      measureEl.textContent = text;
      measureEl.style.cssText = `
        position: absolute;
        visibility: hidden;
        font-style: italic;
        font-family: "KaiTi", "STKaiti", "SimSun", "Microsoft YaHei", sans-serif;
        font-size: ${fontSize}px;
        letter-spacing: 2px;
        white-space: nowrap;
      `;
      document.body.appendChild(measureEl);
      const rect = measureEl.getBoundingClientRect();
      document.body.removeChild(measureEl);
      return { width: rect.width, height: rect.height };
    }

    function getFontSize() {
      const w = window.innerWidth;
      if (w <= 480) return 18;
      if (w <= 768) return 22;
      return 30;
    }

    function getCenterFontSize() {
      const w = window.innerWidth;
      if (w <= 480) return 28;
      if (w <= 768) return 32;
      return 42;
    }

    function initWords() {
      // 清空容器
      container.innerHTML = '';
      const positions = [];
      
      const viewW = window.innerWidth;
      const viewH = window.innerHeight;
      
      // 中心点向左偏移
      const centerX = viewW / 2 - 80; // 整体向左移动80px
      const centerY = viewH / 2;
      
      const fontSize = getFontSize();
      const centerFontSize = getCenterFontSize();
      
      // 测量中心文字尺寸
      const centerSize = measureText("我会喜欢徐依晨的全部", centerFontSize);
      
      // 记录中心文字位置
      positions.push({
        x: centerX,
        y: centerY,
        width: centerSize.width,
        height: centerSize.height,
        isCenter: true
      });

      // 计算安全距离
      const minDistFromCenter = Math.max(centerSize.width, centerSize.height) * 1.5 + 40;
      const minDistBetweenWords = Math.max(80, viewW * 0.08);

      // 预测量所有文字尺寸
      const wordSizes = {};
      words.forEach(word => {
        wordSizes[word] = measureText(word, fontSize);
      });

      words.forEach((word, index) => {
        const div = document.createElement('div');
        div.className = 'word';
        div.textContent = word;
        container.appendChild(div);

        const wordSize = wordSizes[word];
        let validPosition = false;
        let x, y, attempts = 0;
        const maxAttempts = 300;

        // 寻找不重叠的位置
        while (!validPosition && attempts < maxAttempts) {
          // 使用极坐标生成位置，偏向左侧
          const angle = Math.random() * 2 * Math.PI;
          const radius = minDistFromCenter + Math.random() * (Math.min(viewW, viewH) * 0.45);
          
          x = centerX + Math.cos(angle) * radius;
          y = centerY + Math.sin(angle) * radius;

          // 边界检查（考虑文字尺寸）
          const margin = 30;
          if (x - wordSize.width / 2 < margin || 
              x + wordSize.width / 2 > viewW - margin || 
              y - wordSize.height / 2 < margin || 
              y + wordSize.height / 2 > viewH - margin) {
            attempts++;
            continue;
          }

          // 碰撞检测
          let tooClose = false;
          for (const pos of positions) {
            const dx = x - pos.x;
            const dy = y - pos.y;
            const dist = Math.hypot(dx, dy);
            
            const minDist = pos.isCenter ? 
              minDistFromCenter + wordSize.width * 0.5 : 
              minDistBetweenWords;
            
            if (dist < minDist) {
              tooClose = true;
              break;
            }
          }

          if (!tooClose) {
            validPosition = true;
            positions.push({
              x: x,
              y: y,
              width: wordSize.width,
              height: wordSize.height,
              isCenter: false
            });
          }
          attempts++;
        }

        // 如果找不到合适位置，使用网格扫描
        if (!validPosition) {
          const margin = 30;
          const stepX = wordSize.width + 20;
          const stepY = wordSize.height + 20;
          
          outerLoop:
          for (let sy = margin; sy < viewH - margin - wordSize.height; sy += stepY * 0.5) {
            for (let sx = margin; sx < viewW - margin - wordSize.width; sx += stepX * 0.5) {
              const cx = sx + wordSize.width / 2;
              const cy = sy + wordSize.height / 2;
              
              let tooClose = false;
              for (const pos of positions) {
                const dx = cx - pos.x;
                const dy = cy - pos.y;
                const dist = Math.hypot(dx, dy);
                
                const minDist = pos.isCenter ? 
                  minDistFromCenter + wordSize.width * 0.5 : 
                  minDistBetweenWords;
                
                if (dist < minDist) {
                  tooClose = true;
                  break;
                }
              }
              
              if (!tooClose) {
                x = sx;
                y = sy;
                validPosition = true;
                positions.push({
                  x: cx,
                  y: cy,
                  width: wordSize.width,
                  height: wordSize.height,
                  isCenter: false
                });
                break outerLoop;
              }
            }
          }
        }

        // 设置位置
        div.style.left = `${x - wordSize.width / 2}px`;
        div.style.top = `${y - wordSize.height / 2}px`;

        // 随机漂浮参数
        const duration = 4 + Math.random() * 3;
        const delay = Math.random() * 2;
        div.style.animationDuration = `${duration}s`;
        div.style.animationDelay = `${delay}s`;

        // 逐个显示文字
        setTimeout(() => {
          div.classList.add('show');
        }, index * 80);
      });
    }

    // 页面加载完成后执行
    window.onload = () => {
      centerText.style.opacity = '1';
      setTimeout(initWords, 500);
    };

    // 窗口缩放时重新布局
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      const allWords = container.querySelectorAll('.word');
      allWords.forEach(el => el.classList.remove('show'));
      
      resizeTimer = setTimeout(() => {
        initWords();
      }, 500);
    });
  </script>
</body>
</html>
