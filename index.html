<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>喜欢徐依晨的全部 · 随机分布</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0a0a0c;
      font-family: "KaiTi", "STKaiti", "SimSun", "Microsoft YaHei", "Noto Serif SC", serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    /* 中心主文字 - 白色 */
    .center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-weight: 400;
      font-style: italic;
      opacity: 0;
      transition: opacity 1s ease;
      z-index: 15;
      color: #ffffff;
      text-shadow: 0 0 40px rgba(255, 255, 255, 0.8), 0 0 80px rgba(255, 255, 255, 0.4), 0 0 120px rgba(200, 200, 255, 0.3);
      letter-spacing: 4px;
      white-space: nowrap;
      background: radial-gradient(circle, rgba(0,0,0,0.7) 0%, transparent 70%);
      padding: 0.4em 0.8em;
      border-radius: 60px;
      backdrop-filter: blur(2px);
      line-height: 1.3;
      pointer-events: none;
    }

    /* 漂浮词汇 - 白色 */
    .word {
      position: absolute;
      opacity: 0;
      transition: opacity 0.8s ease;
      font-style: italic;
      white-space: nowrap;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.6), 0 0 40px rgba(200, 200, 255, 0.4), 0 0 60px rgba(255, 255, 255, 0.3);
      letter-spacing: 2.5px;
      font-weight: 300;
      backdrop-filter: blur(1px);
      pointer-events: none;
      will-change: transform, opacity;
      z-index: 5;
    }

    .word.show {
      opacity: 0.9;
      animation: gentleFloat 6s infinite alternate ease-in-out;
    }

    @keyframes gentleFloat {
      0% {
        transform: translate(0, 0) scale(1);
      }
      100% {
        transform: translate(8px, -10px) scale(1.02);
      }
    }

    /* 响应式字号：均已增加5px */
    @media (max-width: 480px) {
      .center-text { font-size: 34px; }
      .word { font-size: 26px; }
    }
    @media (min-width: 481px) and (max-width: 768px) {
      .center-text { font-size: 40px; }
      .word { font-size: 30px; }
    }
    @media (min-width: 769px) and (max-width: 1024px) {
      .center-text { font-size: 48px; }
      .word { font-size: 36px; }
    }
    @media (min-width: 1025px) and (max-width: 2000px) {
      .center-text { font-size: 56px; }
      .word { font-size: 44px; }
    }
    @media (min-width: 2001px) {
      .center-text { font-size: 64px; }
      .word { font-size: 54px; }
    }
  </style>
</head>
<body>
  <div class="center-text" id="centerText">我会喜欢徐依晨的全部</div>
  <div id="wordsContainer"></div>

  <script>
    (function() {
      // 所有词汇（37个）
      const words = [
        "徐依晨的名字", "徐依晨的性格", "徐依晨的样子", "徐依晨的鼻子", "徐依晨的眼睛", 
        "徐依晨的耳朵", "徐依晨的嘴巴", "徐依晨的快乐", "徐依晨的难过", "徐依晨的美丽", 
        "徐依晨的声音", "徐依晨的开朗", "徐依晨的不堪", "徐依晨的优点", "徐依晨的腼腆", 
        "徐依晨的窘迫", "徐依晨的脆弱", "徐依晨的生气", "徐依晨的底线", "徐依晨的古板", 
        "徐依晨的家人", "徐依晨的人格", "徐依晨的家乡", "徐依晨的三观", "徐依晨的嗜好", 
        "徐依晨的灵动", "徐依晨的善良", "徐依晨的经历", "徐依晨的生日", "徐依晨的浪漫", 
        "徐依晨的不甘", "徐依晨的固执", "徐依晨的朋友", "徐依晨的尊严", "徐依晨的天真", 
        "徐依晨的美好", "徐依晨的血型"
      ];

      const container = document.getElementById('wordsContainer');
      
      // 存储已放置的词汇矩形
      let placedRects = [];
      
      // 获取当前视口下的字号
      function getCurrentFontSize() {
        const width = window.innerWidth;
        if (width <= 480) return 26;
        if (width <= 768) return 30;
        if (width <= 1024) return 36;
        if (width <= 2000) return 44;
        return 54;
      }

      function getCenterFontSize() {
        const width = window.innerWidth;
        if (width <= 480) return 34;
        if (width <= 768) return 40;
        if (width <= 1024) return 48;
        if (width <= 2000) return 56;
        return 64;
      }

      // 动态测量文字实际占用的宽高
      function measureText(text, fontSize) {
        const span = document.createElement('span');
        span.textContent = text;
        span.style.position = 'absolute';
        span.style.visibility = 'hidden';
        span.style.fontStyle = 'italic';
        span.style.fontFamily = getComputedStyle(document.body).fontFamily;
        span.style.fontSize = `${fontSize}px`;
        span.style.letterSpacing = '2.5px';
        span.style.whiteSpace = 'nowrap';
        span.style.padding = '0';
        span.style.margin = '0';
        document.body.appendChild(span);
        const rect = span.getBoundingClientRect();
        const width = rect.width;
        const height = rect.height;
        document.body.removeChild(span);
        return { width: width + 10, height: height + 8 }; // 添加缓冲
      }

      // 检查两个矩形是否重叠
      function isOverlapping(rect1, rect2, buffer) {
        return !(
          rect1.right + buffer < rect2.left ||
          rect1.left - buffer > rect2.right ||
          rect1.bottom + buffer < rect2.top ||
          rect1.top - buffer > rect2.bottom
        );
      }

      // 检查位置是否有效（不与任何已放置元素重叠，且在边界内）
      function isValidPosition(rect, isFirstWord) {
        const viewW = window.innerWidth;
        const viewH = window.innerHeight;
        const margin = Math.max(10, viewW * 0.02);
        
        // 边界检查
        if (rect.left < margin || rect.right > viewW - margin ||
            rect.top < margin || rect.bottom > viewH - margin) {
          return false;
        }
        
        // 与已放置元素检查碰撞
        for (let i = 0; i < placedRects.length; i++) {
          const placed = placedRects[i];
          let buffer;
          
          if (placed.isCenter) {
            // 与中心文字保持较大距离
            buffer = Math.max(60, viewW * 0.08);
          } else {
            // 词汇之间保持适当间距
            buffer = Math.max(25, viewW * 0.03);
          }
          
          if (isOverlapping(rect, placed, buffer)) {
            return false;
          }
        }
        
        return true;
      }

      // 随机生成位置（确保不重叠）
      function findRandomPosition(wordWidth, wordHeight) {
        const viewW = window.innerWidth;
        const viewH = window.innerHeight;
        const margin = Math.max(15, viewW * 0.03);
        const maxAttempts = 2000;
        
        // 随机尝试
        for (let attempt = 0; attempt < maxAttempts; attempt++) {
          const x = margin + Math.random() * (viewW - 2 * margin - wordWidth);
          const y = margin + Math.random() * (viewH - 2 * margin - wordHeight);
          
          const rect = {
            left: x,
            top: y,
            right: x + wordWidth,
            bottom: y + wordHeight
          };
          
          if (isValidPosition(rect, placedRects.length === 1)) {
            return { x, y };
          }
        }
        
        // 如果随机找不到，使用更小的步长扫描
        const stepX = Math.max(10, wordWidth * 0.5);
        const stepY = Math.max(10, wordHeight * 0.5);
        
        for (let y = margin; y < viewH - margin - wordHeight; y += stepY) {
          for (let x = margin; x < viewW - margin - wordWidth; x += stepX) {
            const rect = {
              left: x,
              top: y,
              right: x + wordWidth,
              bottom: y + wordHeight
            };
            
            if (isValidPosition(rect, placedRects.length === 1)) {
              return { x, y };
            }
          }
        }
        
        // 最终兜底
        return { 
          x: margin + Math.random() * (viewW - 2 * margin - wordWidth),
          y: margin + Math.random() * (viewH - 2 * margin - wordHeight)
        };
      }

      // 渲染所有词汇
      function renderWords() {
        // 移除旧词汇
        while (container.firstChild) {
          container.removeChild(container.firstChild);
        }
        placedRects = [];
        
        const viewW = window.innerWidth;
        const viewH = window.innerHeight;
        const centerFontSize = getCenterFontSize();
        const wordFontSize = getCurrentFontSize();
        
        // 测量并放置中心文字
        const centerTextStr = "我会喜欢徐依晨的全部";
        const centerSize = measureText(centerTextStr, centerFontSize);
        const centerX = viewW / 2;
        const centerY = viewH / 2;
        
        const centerRect = {
          left: centerX - centerSize.width / 2,
          top: centerY - centerSize.height / 2,
          right: centerX + centerSize.width / 2,
          bottom: centerY + centerSize.height / 2,
          isCenter: true
        };
        placedRects.push(centerRect);
        
        // 随机打乱词汇顺序，使分布更自然
        const shuffledWords = [...words].sort(() => Math.random() - 0.5);
        
        // 预测量所有词汇尺寸
        const wordSizes = new Map();
        shuffledWords.forEach(w => {
          wordSizes.set(w, measureText(w, wordFontSize));
        });
        
        // 逐个放置词汇
        shuffledWords.forEach((word, index) => {
          const size = wordSizes.get(word);
          const pos = findRandomPosition(size.width, size.height);
          
          // 记录该词汇矩形
          const wordRect = {
            left: pos.x,
            top: pos.y,
            right: pos.x + size.width,
            bottom: pos.y + size.height,
            isCenter: false
          };
          placedRects.push(wordRect);
          
          // 创建词汇元素
          const wordDiv = document.createElement('div');
          wordDiv.className = 'word';
          wordDiv.textContent = word;
          wordDiv.style.left = `${pos.x}px`;
          wordDiv.style.top = `${pos.y}px`;
          
          // 随机动画参数
          const duration = 5 + Math.random() * 5;
          const delay = Math.random() * 2;
          wordDiv.style.animationDuration = `${duration}s`;
          wordDiv.style.animationDelay = `${delay}s`;
          
          container.appendChild(wordDiv);
          
          // 依次显现，增加随机延迟
          setTimeout(() => {
            wordDiv.classList.add('show');
          }, index * 70 + Math.random() * 200);
        });
      }

      // 防抖处理窗口大小变化
      let resizeTimer;
      function handleResize() {
        const allWords = container.querySelectorAll('.word');
        allWords.forEach(el => el.classList.remove('show'));
        
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          renderWords();
        }, 500);
      }

      // 初始化
      window.addEventListener('load', () => {
        const centerEl = document.getElementById('centerText');
        if (centerEl) {
          centerEl.style.opacity = '1';
        }
        setTimeout(renderWords, 300);
      });

      window.addEventListener('resize', handleResize);
      window.addEventListener('orientationchange', () => {
        setTimeout(handleResize, 300);
      });

    })();
  </script>
</body>
</html>
